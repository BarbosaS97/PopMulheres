    function showPromptModal(title, callback, defaultValue = '') {
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container" style="max-width:450px;"><h3 style="color:#551E75;">${title}</h3><input type="text" id="promptInput" placeholder="Digite o valor" value="${defaultValue.replace(/"/g, '&quot;')}" style="width:100%; padding:12px; border:2px solid #e9d5ff; border-radius:24px; margin:16px 0;"><div class="modal-buttons"><button id="promptConfirm" class="btn-primary">Confirmar</button><button id="promptCancel" class="btn-secondary">Cancelar</button></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector('#promptConfirm').onclick = () => { let val = modal.querySelector('#promptInput').value; if(val) callback(val); modal.remove(); };
        modal.querySelector('#promptCancel').onclick = () => modal.remove();
    }

    async function loadAllMothers() {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/mothers?select=*&order=name`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
        if(res.ok) allMothers = await res.json();
        return allMothers;
    }
    
    async function loadOrgansAndServices() {
        if(allOrgans.length > 0) return;
        const organsRes = await fetch(`${SUPABASE_URL}/rest/v1/organs?select=*&order=name`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
        if(organsRes.ok) allOrgans = await organsRes.json();
        await Promise.all(allOrgans.map(async organ => {
            const servicesRes = await fetch(`${SUPABASE_URL}/rest/v1/services?select=*&organ_id=eq.${organ.id}&order=name`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
            if(servicesRes.ok) allServices[organ.id] = await servicesRes.json();
        }));
    }

    async function reloadOrgansAndServices() {
        allOrgans = [];
        allServices = {};
        await loadOrgansAndServices();
    }
    
    document.getElementById('searchMother').addEventListener('input', (e) => searchMothers(e.target.value));
    
    async function searchMothers(q) {
        if(!q.trim()) { document.getElementById('searchResults').classList.remove('active'); return; }
        const filtered = allMothers.filter(m => m.name.toLowerCase().includes(q.toLowerCase()));
        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = '';
        if(filtered.length){
            resultsDiv.classList.add('active');
            filtered.forEach(m => { let div = document.createElement('div'); div.className='search-item'; div.textContent=m.name; div.onclick=()=>selectMother(m); resultsDiv.appendChild(div); });
        } else resultsDiv.classList.remove('active');
    }
    
    window.showFullMotherRegistration = function(editMode = false, motherData = null) {
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        let title = editMode ? 'Editar Mãe' : 'Cadastrar Nova Mãe';
        let saveBtnText = editMode ? 'Salvar Alterações' : 'Salvar e Atender';
        let motherName = editMode && motherData ? motherData.name || '' : '';
        let motherBirth = editMode && motherData && motherData.birth_date ? motherData.birth_date : '';
        let motherCpf = editMode && motherData && motherData.cpf ? motherData.cpf : '';
        let motherObs = editMode && motherData && motherData.observation ? motherData.observation : '';
        let childrenHtml = '';
        if(!editMode) {
            childrenHtml = `<div class="form-group"><label>Filhos</label><div id="childrenList"><div class="child-row"><input type="text" placeholder="Nome do filho" class="child-name" style="flex:1"><input type="text" placeholder="Idade" class="child-age" style="width:100px"></div></div><button type="button" class="btn-add-child" id="addChildField">+ Adicionar filho</button></div>`;
        }
        modal.innerHTML = `<div class="modal-container">
            <h3>${title}</h3>
            <div class="form-group"><label>Nome completo *</label><input type="text" id="newMotherName" placeholder="Nome da mãe" value="${motherName.replace(/"/g, '&quot;')}"></div>
            <div class="form-group"><label>Data de nascimento</label><input type="date" id="newMotherBirth" value="${motherBirth}"></div>
            <div class="form-group"><label>CPF (opcional)</label><input type="text" id="newMotherCpf" placeholder="000.000.000-00" value="${motherCpf}"></div>
            <div class="form-group"><label>Observação</label><input type="text" id="newMotherObs" placeholder="Ex: gestante, necessidades especiais" value="${motherObs.replace(/"/g, '&quot;')}"></div>
            ${childrenHtml}
            <div class="modal-buttons"><button id="saveNewMotherBtn" class="btn-primary">${saveBtnText}</button><button id="cancelNewMotherBtn" class="btn-secondary">Cancelar</button></div>
        </div>`;
        document.body.appendChild(modal);
        
        if(!editMode) {
            document.getElementById('addChildField').onclick = () => {
                let container = document.getElementById('childrenList');
                let div = document.createElement('div'); div.className = 'child-row';
                div.innerHTML = `<input type="text" placeholder="Nome do filho" class="child-name" style="flex:1"><input type="text" placeholder="Idade" class="child-age" style="width:100px"><button type="button" class="btn-remove-child" onclick="this.parentElement.remove()">X</button>`;
                container.appendChild(div);
            };
        }
        
        modal.querySelector('#saveNewMotherBtn').onclick = async () => {
            let name = document.getElementById('newMotherName').value;
            if(!name) { showAlertModal('Nome da mãe é obrigatório', false); return; }
            let birth = document.getElementById('newMotherBirth').value;
            let cpf = document.getElementById('newMotherCpf').value;
            let obs = document.getElementById('newMotherObs').value;
            let cpfToSend = cpf && cpf.trim() !== '' ? cpf : null;
            
            try {
                if(editMode && motherData) {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/mothers?id=eq.${motherData.id}`, { 
                        method:'PATCH', 
                        headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, 
                        body: JSON.stringify({ name, birth_date: birth || null, cpf: cpfToSend, observation: obs || null }) 
                    });
                    if(response.ok) {
                        showAlertModal('Mãe editada com sucesso!', true);
                        modal.remove();
                        await loadAllMothers();
                        if(currentMother && currentMother.id === motherData.id) {
                            await selectMother({ ...currentMother, name });
                        }
                        adminCache.crudFamilies = null;
                        adminCache.organs = null;
                        adminCache.families = null;
                        if(adminModal && document.body.contains(adminModal) && currentAdminTab === 'crudFamilies') await loadCrudFamilies();
                    } else {
                        const error = await response.text();
                        showAlertModal('Erro ao editar: ' + error, false);
                    }
                } else {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/mothers`, {
                        method:'POST',
                        headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=representation' },
                        body: JSON.stringify({ name, birth_date: birth || null, cpf: cpfToSend, observation: obs || null })
                    });

                    if(response.ok){
                        const newMother = await response.json();
                        const motherId = newMother[0]?.id;
                        if(motherId) {
                            let childrenNames = document.querySelectorAll('.child-name');
                            let childrenAges = document.querySelectorAll('.child-age');
                            for(let i=0; i<childrenNames.length; i++){
                                if(childrenNames[i].value){
                                    await fetch(`${SUPABASE_URL}/rest/v1/children`, { 
                                        method:'POST', 
                                        headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, 
                                        body: JSON.stringify({ mother_id: motherId, name: childrenNames[i].value, age: childrenAges[i]?.value || null }) 
                                    });
                                }
                            }
                            showAlertModal('Mãe e filhos cadastrados com sucesso!', true);
                            modal.remove();
                            await loadAllMothers();
                            const motherDataComplete = allMothers.find(m => m.id === motherId);
                            if(motherDataComplete) await selectMother(motherDataComplete);
                            else location.reload();
                            adminCache.crudFamilies = null;
                            adminCache.organs = null;
                            adminCache.families = null;
                            if(adminModal && document.body.contains(adminModal) && currentAdminTab === 'crudFamilies') await loadCrudFamilies();
                        } else {
                            showAlertModal('Erro ao obter ID da mãe cadastrada.', false);
                            modal.remove();
                            await loadAllMothers();
                        }
                    } else {
                        const error = await response.text();
                        if(error.includes('duplicate key')) showAlertModal('CPF já cadastrado.', false);
                        else showAlertModal('Erro ao cadastrar: ' + error, false);
                    }
                }
            } catch(e) { showAlertModal('Erro ao processar. Tente novamente.', false); }
        };
        modal.querySelector('#cancelNewMotherBtn').onclick = () => modal.remove();
    };
    
    document.getElementById('btnNotRegistered').onclick = () => window.showFullMotherRegistration(false);
    
    async function selectMother(mother){
        currentMother = mother;
        document.getElementById('searchMother').value = mother.name;
        document.getElementById('searchResults').classList.remove('active');
        await loadFamilyTree(mother.id);
        await loadOrCreateAttendance(mother.id);
        await loadQuestionnaire(mother.id);
        
        // Verificar se o atendimento já foi finalizado
        isEditMode = false;
        const btnFinalizar = document.getElementById('btnFinalizar');
        const btnEditFamily = document.getElementById('btnEditFamily');
        
        if(currentAttendance && currentAttendance.is_finished) {
            btnFinalizar.style.display = 'none';
            btnEditFamily.style.display = 'block';
            document.querySelector('.attendance-area').classList.add('finished');
            document.getElementById('attendanceContent').innerHTML = '<div class="readonly-indicator">✅ Atendimento Finalizado — Selecione um familiar para visualizar os serviços registrados.</div>';
            currentFamilyMember = null;
        } else {
            btnFinalizar.style.display = 'block';
            btnEditFamily.style.display = 'none';
            document.querySelector('.attendance-area').classList.remove('finished');
            document.getElementById('attendanceContent').innerHTML = '<div style="text-align:center;color:#a78bfa;padding:60px;">Selecione um familiar à esquerda</div>';
            currentFamilyMember = null;
        }
    }
    
    // Função para editar atendimento (reativar campos)
    window.editAttendance = async function() {
        if(currentAttendance && currentAttendance.is_finished) {
            showPasswordModal(async () => {
                await fetch(`${SUPABASE_URL}/rest/v1/attendances?id=eq.${currentAttendance.id}`, { 
                    method:'PATCH', 
                    headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, 
                    body: JSON.stringify({ is_finished: false, finished_at: null }) 
                });
                currentAttendance.is_finished = false;
                isEditMode = true;
                document.getElementById('btnFinalizar').style.display = 'block';
                document.getElementById('btnEditFamily').style.display = 'none';
                document.querySelector('.attendance-area').classList.remove('finished');
                document.getElementById('attendanceContent').innerHTML = '<div style="text-align:center;color:#a78bfa;padding:60px;">Selecione um familiar à esquerda para editar</div>';
                showAlertModal('Atendimento reativado para edição!', true);
                // Limpar caches
                servicesCache = {};
                questionnaireCache = {};
                adminCache.families = null;
                adminCache.organs = null;
            });
        }
    };
    
    document.getElementById('btnEditFamily').onclick = window.editAttendance;
    
    async function loadFamilyTree(motherId){
        const childrenResp = await fetch(`${SUPABASE_URL}/rest/v1/children?select=*&mother_id=eq.${motherId}&order=name`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
        let children = childrenResp.ok ? await childrenResp.json() : [];
        let html = `<div class="mother-node"><div class="member-card" onclick="selectFamilyMember('mother', ${currentMother.id}, '${currentMother.name.replace(/'/g, "\\'")}')"><div class="member-name">${currentMother.name}</div><div class="member-info">Mãe</div></div>`;
        if(children.length > 0){
            html += `<div class="children-container">`;
            children.forEach(c => { html += `<div class="child-card" onclick="selectFamilyMember('child', ${c.id}, '${c.name.replace(/'/g, "\\'")}')"><div class="member-name">${c.name}</div><div class="member-info">Filho(a) • ${c.age || 'idade não informada'}</div></div>`; });
            html += `</div>`;
        } else { html += `<div class="children-container" style="color:#a78bfa; font-size:0.8rem; padding:8px 0 8px 20px;">Nenhum filho cadastrado</div>`; }
        html += `</div>`;
        document.getElementById('familyTree').innerHTML = html;
    }
    
    async function loadOrCreateAttendance(motherId){
        try {
            const resp = await fetch(`${SUPABASE_URL}/rest/v1/attendances?select=*&mother_id=eq.${motherId}&order=created_at.desc&limit=1`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
            if(!resp.ok) throw new Error();
            const data = await resp.json();
            if(data && data.length) currentAttendance = data[0];
            else {
                const ins = await fetch(`${SUPABASE_URL}/rest/v1/attendances`, { method:'POST', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=representation' }, body: JSON.stringify({ mother_id: motherId, is_finished: false }) });
                if(ins.ok) { const newAtt = await ins.json(); if(newAtt && newAtt[0]) currentAttendance = newAtt[0]; }
            }
        } catch(e) { currentAttendance = { id: Date.now(), mother_id: motherId, is_finished: false }; }
    }

    async function loadQuestionnaire(motherId) {
        currentQuestionnaire = { id: null, homeless: false, domestic_violence: false, protective_measure: false, children_school: false, serious_illness: false, obs: '' };
        if(questionnaireCache[motherId]) {
            currentQuestionnaire = questionnaireCache[motherId];
            return;
        }
        
        try {
            const resp = await fetch(`${SUPABASE_URL}/rest/v1/questionnaires?select=*&mother_id=eq.${motherId}&limit=1`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
            if(resp.ok && resp.status !== 404) {
                const data = await resp.json();
                if(data && data.length) {
                    currentQuestionnaire = data[0];
                    questionnaireCache[motherId] = data[0];
                } else {
                    currentQuestionnaire = { id: null, homeless: false, domestic_violence: false, protective_measure: false, children_school: false, serious_illness: false, obs: '' };
                    questionnaireCache[motherId] = currentQuestionnaire;
                }
            }
        } catch(e) { console.log('Questionário não encontrado'); }
    }

    async function saveQuestionnaire() {
        if(!currentMother || currentMemberType !== 'mother') return;
        const questionnaireData = {
            mother_id: currentMother.id,
            homeless: currentQuestionnaire.homeless,
            domestic_violence: currentQuestionnaire.domestic_violence,
            protective_measure: currentQuestionnaire.protective_measure,
            children_school: currentQuestionnaire.children_school,
            serious_illness: currentQuestionnaire.serious_illness,
            obs: currentQuestionnaire.obs
        };
        try {
            if(currentQuestionnaire.id) {
                await fetch(`${SUPABASE_URL}/rest/v1/questionnaires?id=eq.${currentQuestionnaire.id}`, { method:'PATCH', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, body: JSON.stringify(questionnaireData) });
            } else {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/questionnaires`, { method:'POST', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=representation' }, body: JSON.stringify(questionnaireData) });
                if(res.ok) { const newData = await res.json(); if(newData && newData[0]) currentQuestionnaire.id = newData[0].id; }
            }
            questionnaireCache[currentMother.id] = currentQuestionnaire;
        } catch(e) { console.log('Erro ao salvar questionário'); }
    }
    
    window.selectFamilyMember = async function(type, id, name){
        // Mostrar loading
        document.getElementById('attendanceContent').innerHTML = '<div class="loading-container"><div class="spinner"></div><div>Carregando atendimento...</div></div>';
        
        currentFamilyMember = { id, name };
        currentMemberType = type;
        
        // Verificar cache
        const cacheKey = `${currentAttendance.id}_${type}_${id}`;
        if(servicesCache[cacheKey]) {
            currentMemberServices = servicesCache[cacheKey];
            renderServiceForm();
            return;
        }
        
        await loadMemberServices();

        const isFinished = currentAttendance && currentAttendance.is_finished && !isEditMode;
        if(currentMemberServices.length === 0 && !isFinished) {
            currentMemberServices.push({ id: null, organ_id: null, service_id: null });
        }

        servicesCache[cacheKey] = currentMemberServices;
        renderServiceForm();
    };
    
    async function loadMemberServices() {
        if(!currentAttendance || !currentFamilyMember) return;
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/attendance_items?select=*,organs(name),services(name)&attendance_id=eq.${currentAttendance.id}&family_member_type=eq.${currentMemberType}&family_member_id=eq.${currentFamilyMember.id}`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
        if(resp.ok) {
            const items = await resp.json();
            currentMemberServices = items.map(item => ({
                id: item.id,
                organ_id: item.organ_id,
                service_id: item.service_id,
                organ_name: item.organs?.name || item.organ_name,
                service_name: item.services?.name || item.service_name
            }));
        } else {
            currentMemberServices = [];
        }
    }
    
    async function saveServiceRow(organId, serviceId, serviceIdToEdit = null) {
        if(!currentAttendance || !currentFamilyMember) return null;
        const organ = allOrgans.find(o => o.id == organId);
        const services = allServices[organId] || [];
        const service = services.find(s => s.id == serviceId);
        
        const serviceData = {
            attendance_id: currentAttendance.id,
            family_member_type: currentMemberType,
            family_member_id: currentFamilyMember.id,
            organ_id: parseInt(organId),
            service_id: parseInt(serviceId),
            organ_name: organ?.name,
            service_name: service?.name
        };
        
        if(serviceIdToEdit) {
            await fetch(`${SUPABASE_URL}/rest/v1/attendance_items?id=eq.${serviceIdToEdit}`, { method:'PATCH', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, body: JSON.stringify(serviceData) });
            return serviceIdToEdit;
        } else {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/attendance_items`, { method:'POST', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=representation' }, body: JSON.stringify(serviceData) });
            if(res.ok) {
                const newItem = await res.json();
                return newItem[0]?.id;
            }
        }
        return null;
    }
    
    async function deleteServiceRow(serviceId) {
        if(!serviceId) return;
        await fetch(`${SUPABASE_URL}/rest/v1/attendance_items?id=eq.${serviceId}`, { method:'DELETE', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} });
    }
    
    async function renderServiceForm() {
        await loadOrgansAndServices();
        
        const isReadOnly = currentAttendance && currentAttendance.is_finished && !isEditMode;
        
        let servicesHtml = '';
        for(let i = 0; i < currentMemberServices.length; i++) {
            const s = currentMemberServices[i];
            servicesHtml += `
                <div class="service-row" data-id="${s.id || ''}">
                    <select class="organ-select" data-service-id="${s.id}" style="flex:1" ${isReadOnly ? 'disabled' : ''}>
                        <option value="">Selecionar órgão</option>
                        ${allOrgans.map(o => `<option value="${o.id}" ${o.id == s.organ_id ? 'selected' : ''}>${o.name}</option>`).join('')}
                    </select>
                    <select class="service-select" data-service-id="${s.id}" style="flex:1" ${!s.organ_id ? 'disabled' : ''} ${isReadOnly ? 'disabled' : ''}>
                        ${s.organ_id && allServices[s.organ_id] ? 
                            '<option value="">Selecionar serviço</option>' + allServices[s.organ_id].map(serv => `<option value="${serv.id}" ${serv.id == s.service_id ? 'selected' : ''}>${serv.name}</option>`).join('') :
                            '<option value="">Selecione um órgão primeiro</option>'}
                    </select>
                    <button class="btn-remove-service" data-service-id="${s.id}" ${isReadOnly ? 'disabled' : ''}>🗑️ Remover</button>
                </div>
            `;
        }
        
        let questionnaireHtml = '';
        if(currentMemberType === 'mother') {
            questionnaireHtml = `
                <div class="questionnaire-section">
                    <div class="questionnaire-title">Questionário de Acolhimento</div>
                    <div class="checkbox-group">
                        <div class="checkbox-item"><input type="checkbox" id="homeless" ${currentQuestionnaire.homeless ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''}><label for="homeless" ${isReadOnly ? 'class="disabled"' : ''}>Mulher em situação de rua?</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="domestic_violence" ${currentQuestionnaire.domestic_violence ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''}><label for="domestic_violence" ${isReadOnly ? 'class="disabled"' : ''}>Sofre violência doméstica?</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="protective_measure" ${currentQuestionnaire.protective_measure ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''}><label for="protective_measure" ${isReadOnly ? 'class="disabled"' : ''}>Tem medida protetiva?</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="children_school" ${currentQuestionnaire.children_school ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''}><label for="children_school" ${isReadOnly ? 'class="disabled"' : ''}>Filhos frequentam ambiente escolar?</label></div>
                        <div class="checkbox-item"><input type="checkbox" id="serious_illness" ${currentQuestionnaire.serious_illness ? 'checked' : ''} ${isReadOnly ? 'disabled' : ''}><label for="serious_illness" ${isReadOnly ? 'class="disabled"' : ''}>Tem diagnóstico de doença grave?</label></div>
                    </div>
                    <div class="form-group" style="margin-top:16px;">
                        <label>Observações gerais</label>
                        <textarea id="familyObs" placeholder="Informações adicionais sobre a família..." ${isReadOnly ? 'disabled' : ''}>${currentQuestionnaire.obs || ''}</textarea>
                    </div>
                </div>
            `;
        }
        
        const html = `
            ${isReadOnly ? '<div class="readonly-indicator">✅ Atendimento finalizado — Visualização somente leitura. Clique em "Editar Atendimento" para modificar.</div>' : ''}
            <div class="attendance-header">
                <h2>${currentFamilyMember.name}</h2>
                <p>${currentMemberType === 'mother' ? 'Responsável familiar' : 'Filho(a)'}</p>
            </div>
            <div class="services-container" id="servicesContainer">${servicesHtml}</div>
            <button class="btn-add-row" id="addNewRowBtn" ${isReadOnly ? 'disabled' : ''}>+ Adicionar nova linha</button>
            ${questionnaireHtml}
        `;
        
        document.getElementById('attendanceContent').innerHTML = html;
        
        if(!isReadOnly) {
            attachRowEvents();
            document.getElementById('addNewRowBtn').onclick = () => addNewEmptyRow();
        }
        
        if(currentMemberType === 'mother' && !isReadOnly) {
            document.getElementById('homeless').onchange = (e) => { currentQuestionnaire.homeless = e.target.checked; saveQuestionnaire(); };
            document.getElementById('domestic_violence').onchange = (e) => { currentQuestionnaire.domestic_violence = e.target.checked; saveQuestionnaire(); };
            document.getElementById('protective_measure').onchange = (e) => { currentQuestionnaire.protective_measure = e.target.checked; saveQuestionnaire(); };
            document.getElementById('children_school').onchange = (e) => { currentQuestionnaire.children_school = e.target.checked; saveQuestionnaire(); };
            document.getElementById('serious_illness').onchange = (e) => { currentQuestionnaire.serious_illness = e.target.checked; saveQuestionnaire(); };
            document.getElementById('familyObs').onchange = (e) => { currentQuestionnaire.obs = e.target.value; saveQuestionnaire(); };
        }
    }
    
    function attachRowEvents() {
        document.querySelectorAll('.service-row').forEach(row => {
            const organSelect = row.querySelector('.organ-select');
            const serviceSelect = row.querySelector('.service-select');
            const removeBtn = row.querySelector('.btn-remove-service');
            const serviceId = row.dataset.id;
            
            organSelect.addEventListener('change', async (e) => {
                const newOrganId = e.target.value;
                const currentServiceId = row.dataset.id;
                if(newOrganId) {
                    serviceSelect.disabled = false;
                    serviceSelect.innerHTML = '<option value="">Selecionar serviço</option>' + 
                        allServices[newOrganId].map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                    
                    if(currentServiceId) {
                        await saveServiceRow(newOrganId, serviceSelect.value, currentServiceId);
                        await updateCacheAndRefresh();
                    }
                } else {
                    serviceSelect.disabled = true;
                    serviceSelect.innerHTML = '<option value="">Selecione um órgão primeiro</option>';
                    if(currentServiceId) {
                        await deleteServiceRow(currentServiceId);
                        await updateCacheAndRefresh();
                    }
                }
            });
            
            serviceSelect.addEventListener('change', async (e) => {
                const newOrganId = organSelect.value;
                const newServiceId = e.target.value;
                const currentServiceId = row.dataset.id;
                if(newOrganId && newServiceId) {
                    if(currentServiceId) {
                        await saveServiceRow(newOrganId, newServiceId, currentServiceId);
                    } else {
                        const newId = await saveServiceRow(newOrganId, newServiceId, null);
                        if(newId) row.dataset.id = newId;
                    }
                    await updateCacheAndRefresh();
                    showAlertModal('Serviço salvo!', true);
                }
            });
            
            removeBtn.addEventListener('click', async () => {
                const currentServiceId = row.dataset.id;
                if(currentServiceId) {
                    await deleteServiceRow(currentServiceId);
                    await updateCacheAndRefresh();
                    showAlertModal('Serviço removido!', true);
                } else {
                    const rowIndex = [...document.querySelectorAll('.service-row')].indexOf(row);
                    if(rowIndex >= 0) currentMemberServices.splice(rowIndex, 1);
                    row.remove();
                }
            });
        });
    }

    async function loadOrgansStats(){
        try {
            const finishedAttendances = await fetch(
                `${SUPABASE_URL}/rest/v1/attendances?select=id&is_finished=eq.true`,
                { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }
            ).then(r=>r.json());

            if(!finishedAttendances.length) {
                document.getElementById('adminTabContent').innerHTML = '<div class="loading-placeholder">Nenhum atendimento finalizado ainda. Os dados aparecerão aqui após a finalização de um atendimento.</div>';
                return;
            }

            const finishedIds = finishedAttendances.map(a => a.id).join(',');
            const items = await fetch(
                `${SUPABASE_URL}/rest/v1/attendance_items?select=*&attendance_id=in.(${finishedIds})`,
                { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }
            ).then(r=>r.json());

            let organMap = new Map();
            let maxTotal = 0;
            items.forEach(i => {
                if(i.organ_name){
                    if(!organMap.has(i.organ_name)) organMap.set(i.organ_name, { total:0, services: new Map() });
                    let org = organMap.get(i.organ_name);
                    org.total +=1;
                    if(i.service_name) org.services.set(i.service_name, (org.services.get(i.service_name)||0)+1);
                    if(org.total > maxTotal) maxTotal = org.total;
                }
            });
            let sortedOrgans = Array.from(organMap.entries()).sort((a,b)=>b[1].total - a[1].total);

            let html = `<div style="margin-bottom:20px;"><button id="exportOrgansExcel" class="btn-primary">📎 Exportar Órgãos e Serviços (Excel)</button></div>`;
            if(sortedOrgans.length === 0) {
                html += '<div class="loading-placeholder">Nenhum serviço registrado nos atendimentos finalizados.</div>';
            } else {
                html += `<div class="stats-grid">`;
                for(let [orgName, data] of sortedOrgans){
                    let percentage = maxTotal > 0 ? (data.total / maxTotal) * 100 : 0;
                    let sortedServices = Array.from(data.services.entries()).sort((a,b)=>b[1]-a[1]);
                    html += `<div class="stat-card"><h3>${orgName}</h3>
                        <div style="display:flex;justify-content:space-between;padding:8px 0;"><span>Total solicitações:</span><strong>${data.total}</strong></div>
                        <div class="bar-chart"><div class="bar-fill" style="width: ${percentage}%;">${data.total}</div></div>
                        <div class="service-list"><strong>Serviços solicitados (decrescente):</strong>${sortedServices.map(([srvName, qtd])=>`<div class="service-item-stat"><span>${srvName}</span><span>${qtd} vez(es)</span></div>`).join('')}</div></div>`;
                }
                html += `</div>`;
            }
            document.getElementById('adminTabContent').innerHTML = html;

            document.getElementById('exportOrgansExcel').onclick = () => {
                let wsData = [['RELATÓRIO DE ÓRGÃOS E SERVIÇOS SOLICITADOS'], [], ['Órgão', 'Total Solicitações', 'Serviços (quantidade)']];
                for(let [orgName, data] of sortedOrgans){
                    let servText = Array.from(data.services.entries()).map(([s,q])=>`${s} (${q})`).join('; ');
                    wsData.push([orgName, data.total, servText]);
                }
                exportToExcel(wsData, 'orgaos_solicitados', 'Orgaos_Solicitados');
            };
        } catch(e) {
            document.getElementById('adminTabContent').innerHTML = '<div class="loading-placeholder">Erro ao carregar dados</div>';
        }
    }
    
    async function loadFamiliesList(){
        try {
            const [items, attendances, allChildren, questionnaires] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/attendance_items?select=*,attendance_id,family_member_type,family_member_id`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }).then(r=>r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/attendances?select=*,mothers(name)&is_finished=eq.true`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }).then(r=>r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/children?select=*`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }).then(r=>r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/questionnaires?select=*`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }).then(r=>r.json())
            ]);
            
            let html = `<div style="margin-bottom:20px;"><button id="exportFamiliesDetailExcel" class="btn-primary">📎 Exportar Todas Famílias (Excel)</button></div>`;
            html += `<div class="families-container"><h3>Famílias com Atendimento Finalizado</h3>`;
            
            if(attendances.length === 0) {
                html += '<p style="text-align:center;padding:40px;">Nenhuma família com atendimento finalizado</p>';
            }
            
            for(let att of attendances){
                let familyItems = items.filter(i => i.attendance_id === att.id);
                let mother = att.mothers;
                let motherServices = familyItems.filter(i => i.family_member_type === 'mother');
                let childrenServices = familyItems.filter(i => i.family_member_type === 'child');
                let q = questionnaires.find(q => q.mother_id === att.mother_id);
                
                let motherServicesList = motherServices.length ? motherServices.map(s => `${s.organ_name}: ${s.service_name}`).join(', ') : 'Nenhum serviço solicitado';
                let childrenList = [];
                let processedChildren = new Set();
                for(let child of childrenServices){
                    if(!processedChildren.has(child.family_member_id)){
                        processedChildren.add(child.family_member_id);
                        let childInfo = allChildren.find(c => c.id === child.family_member_id);
                        let childSpecific = familyItems.filter(i => i.family_member_type === 'child' && i.family_member_id === child.family_member_id);
                        childrenList.push({ name: childInfo?.name || 'Sem nome', services: childSpecific.map(s => `${s.organ_name}: ${s.service_name}`).join(', ') });
                    }
                }
                let questionnaireFlags = '';
                let obsText = '';
                if(q) {
                    let parts = [];
                    if(q.homeless) parts.push('Situação de rua');
                    if(q.domestic_violence) parts.push('Violência doméstica');
                    if(q.protective_measure) parts.push('Medida protetiva');
                    if(q.children_school) parts.push('Filhos na escola');
                    if(q.serious_illness) parts.push('Doença grave');
                    questionnaireFlags = parts.join(', ');
                    obsText = q.obs || '';
                }
                let expandId = `expand-${att.id}`;
                html += `<div class="family-detail-card">
                    <h4 onclick="toggleExpand('${expandId}')">👪 ${mother?.name || 'N/A'} <span class="expand-icon">▼</span></h4>
                    <div id="${expandId}" class="family-expandable">
                        <div class="member-detail"><strong>Mãe</strong><div class="services-list-small">${motherServicesList}</div></div>`;
                if(questionnaireFlags) {
                    html += `<div class="member-detail"><strong>Questionário</strong><div class="services-list-small">${questionnaireFlags}</div></div>`;
                }
                if(obsText) {
                    html += `<div class="member-detail"><strong>Observações</strong><div class="services-list-small">${obsText}</div></div>`;
                }
                for(let child of childrenList){
                    html += `<div class="member-detail"><strong>Filho(a): ${child.name}</strong><div class="services-list-small">${child.services || 'Nenhum serviço solicitado'}</div></div>`;
                }
                html += `<div class="action-buttons-fam"><button class="btn-danger" onclick="event.stopPropagation(); requestDeleteAttendance(${att.id})">🗑️ Remover Atendimento</button></div></div></div>`;
            }
            html += `</div>`;
            adminCache.families = html;
            document.getElementById('adminTabContent').innerHTML = html;
            
            document.getElementById('exportFamiliesDetailExcel').onclick = () => {
                let wsData = [['FAMÍLIAS ATENDIDAS - RELATÓRIO COMPLETO'], [], ['Família', 'Status', 'Membro', 'Órgão/Serviço', 'Questionário', 'Observações']];
                for(let att of attendances){
                    let familyItems = items.filter(i => i.attendance_id === att.id);
                    let mother = att.mothers;
                    let q = questionnaires.find(q => q.mother_id === att.mother_id);
                    let questionnaireText = '';
                    let obsExcel = '';
                    if(q) {
                        let parts = [];
                        if(q.homeless) parts.push('Rua');
                        if(q.domestic_violence) parts.push('Violência');
                        if(q.protective_measure) parts.push('Medida protetiva');
                        if(q.children_school) parts.push('Escola');
                        if(q.serious_illness) parts.push('Doença grave');
                        questionnaireText = parts.join(', ');
                        obsExcel = q.obs || '';
                    }
                    let motherServices = familyItems.filter(i => i.family_member_type === 'mother');
                    if(motherServices.length) motherServices.forEach(ms => wsData.push([mother?.name || 'N/A', 'Finalizado', 'Mãe', `${ms.organ_name}: ${ms.service_name}`, questionnaireText, obsExcel]));
                    else wsData.push([mother?.name || 'N/A', 'Finalizado', 'Mãe', 'Nenhum serviço', questionnaireText, obsExcel]);
                    let childrenServices = familyItems.filter(i => i.family_member_type === 'child');
                    for(let cs of childrenServices){
                        let childInfo = allChildren.find(c => c.id === cs.family_member_id);
                        wsData.push([mother?.name || 'N/A', 'Finalizado', `Filho: ${childInfo?.name || 'Sem nome'}`, `${cs.organ_name}: ${cs.service_name}`, '', '']);
                    }
                }
                exportToExcel(wsData, 'familias_atendidas', 'Familias_Atendidas');
            };
        } catch(e) { 
            document.getElementById('adminTabContent').innerHTML = '<div class="loading-placeholder">Erro ao carregar dados</div>';
        }
    }

                if(res.ok){
                    let newOrgan = (await res.json())[0];
                    let serviceInputs = document.querySelectorAll('.service-name-input');
                    for(let i=0; i<serviceInputs.length; i++){
                        if(serviceInputs[i].value){
                            await fetch(`${SUPABASE_URL}/rest/v1/services`, { method:'POST', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, body: JSON.stringify({ organ_id: newOrgan.id, name: serviceInputs[i].value }) });
                        }
                    }
                    showAlertModal('Órgão cadastrado com sucesso!', true);
                    adminCache.crudOrgans = null;
                    adminCache.organs = null;
                    modal.remove();
                    loadCrudOrgans();
                    reloadOrgansAndServices();
                } else { modal.remove(); loadCrudOrgans(); }
            } catch(e) { modal.remove(); loadCrudOrgans(); }
        };
        modal.querySelector('#cancelNewOrganBtn').onclick = () => modal.remove();
    };
    
    window.editOrganFromAdmin = async function(id) {
        let organ = await fetch(`${SUPABASE_URL}/rest/v1/organs?id=eq.${id}`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }).then(r=>r.json());
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container" style="max-width:800px;"><h3 style="color:#551E75;">Editar Órgão</h3>
            <div class="form-group"><label>Nome do Órgão *</label><input type="text" id="editOrganName" placeholder="Nome do órgão" value="${(organ[0]?.name || '').replace(/"/g, '&quot;')}"></div>
            <div class="modal-buttons"><button id="saveEditOrganBtn" class="btn-primary">Salvar Alterações</button><button id="cancelEditOrganBtn" class="btn-secondary">Cancelar</button></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector('#saveEditOrganBtn').onclick = async () => {
            let newName = document.getElementById('editOrganName').value;
            if(!newName) { showAlertModal('Nome do órgão é obrigatório', false); return; }
            const res = await fetch(`${SUPABASE_URL}/rest/v1/organs?id=eq.${id}`, { method:'PATCH', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, body: JSON.stringify({ name: newName }) });
            if(res.ok) {
                showAlertModal('Órgão editado com sucesso!', true);
                adminCache.crudOrgans = null;
                adminCache.organs = null;
                modal.remove();
                loadCrudOrgans();
                reloadOrgansAndServices();
            } else { showAlertModal('Erro ao editar órgão', false); }
        };
        modal.querySelector('#cancelEditOrganBtn').onclick = () => modal.remove();
    };
    
    window.addServiceToOrganPrompt = async function(organId) {
        let organ = await fetch(`${SUPABASE_URL}/rest/v1/organs?id=eq.${organId}`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }).then(r=>r.json());
        let organName = organ[0]?.name || 'Órgão';
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container" style="max-width:500px;"><h3 style="color:#551E75;">Adicionar Serviço</h3>
            <div class="form-group"><label>Órgão</label><input type="text" value="${organName}" disabled style="background:#f3e8ff;"></div>
            <div class="form-group"><label>Nome do Serviço *</label><input type="text" id="newServiceName" placeholder="Ex: Atendimento psicológico"></div>
            <div class="modal-buttons"><button id="saveNewServiceBtn" class="btn-primary">Salvar Serviço</button><button id="cancelNewServiceBtn" class="btn-secondary">Cancelar</button></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector('#saveNewServiceBtn').onclick = async () => {
            let serviceName = document.getElementById('newServiceName').value;
            if(!serviceName) { showAlertModal('Nome do serviço é obrigatório', false); return; }
            try {
                const checkRes = await fetch(`${SUPABASE_URL}/rest/v1/services?organ_id=eq.${organId}&name=eq.${encodeURIComponent(serviceName)}`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} });
                const existing = await checkRes.json();
                if(existing && existing.length > 0) { showAlertModal('Serviço já existe neste órgão!', false); modal.remove(); return; }
                const res = await fetch(`${SUPABASE_URL}/rest/v1/services`, { method:'POST', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, body: JSON.stringify({ organ_id: organId, name: serviceName }) });
                if(res.ok){
                    showAlertModal('Serviço adicionado com sucesso!', true);
                    adminCache.crudOrgans = null;
                    adminCache.organs = null;
                    modal.remove();
                    loadCrudOrgans();
                    reloadOrgansAndServices();
                } else { showAlertModal('Erro ao adicionar serviço', false); modal.remove(); }
            } catch(e) { showAlertModal('Erro: ' + e.message, false); modal.remove(); }
        };
        modal.querySelector('#cancelNewServiceBtn').onclick = () => modal.remove();
    };
    
    window.editServicePrompt = async function(id) { 
        let service = await fetch(`${SUPABASE_URL}/rest/v1/services?id=eq.${id}`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }).then(r=>r.json());
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container" style="max-width:500px;"><h3 style="color:#551E75;">Editar Serviço</h3>
            <div class="form-group"><label>Nome do Serviço</label><input type="text" id="editServiceName" value="${(service[0]?.name || '').replace(/"/g, '&quot;')}"></div>
            <div class="modal-buttons"><button id="saveEditServiceBtn" class="btn-primary">Salvar Alterações</button><button id="cancelEditServiceBtn" class="btn-secondary">Cancelar</button></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector('#saveEditServiceBtn').onclick = async () => {
            let newName = document.getElementById('editServiceName').value;
            if(!newName) { showAlertModal('Nome do serviço é obrigatório', false); return; }
            const res = await fetch(`${SUPABASE_URL}/rest/v1/services?id=eq.${id}`, { method:'PATCH', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, body: JSON.stringify({ name: newName }) });
            if(res.ok) {
                showAlertModal('Serviço editado com sucesso!', true);
                adminCache.crudOrgans = null;
                adminCache.organs = null;
                modal.remove();
                loadCrudOrgans();
                reloadOrgansAndServices();
            } else { showAlertModal('Erro ao editar serviço', false); }
        };
        modal.querySelector('#cancelEditServiceBtn').onclick = () => modal.remove();
    };
    
    window.deleteServicePrompt = async function(id) { 
        showConfirmModal('Excluir este serviço?', async () => { 
            await fetch(`${SUPABASE_URL}/rest/v1/services?id=eq.${id}`, { method:'DELETE', headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} });
            adminCache.crudOrgans = null;
            adminCache.organs = null;
            loadCrudOrgans();
            reloadOrgansAndServices();
        }); 
    };
    
    window.deleteOrganPrompt = async function(id, organName) {
        showConfirmModal(`Excluir o órgão "${organName}" e todos os seus serviços? Esta ação também removerá todos os atendimentos relacionados a este órgão.`, async () => { 
            await fetch(`${SUPABASE_URL}/rest/v1/services?organ_id=eq.${id}`, { method:'DELETE', headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} });
            await fetch(`${SUPABASE_URL}/rest/v1/attendance_items?organ_id=eq.${id}`, { method:'DELETE', headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} });
            await fetch(`${SUPABASE_URL}/rest/v1/organs?id=eq.${id}`, { method:'DELETE', headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }); 
            showAlertModal(`Órgão "${organName}" e todos os seus dados foram excluídos com sucesso!`, true);
            adminCache.crudOrgans = null;
            adminCache.organs = null;
            adminCache.families = null;
            await loadCrudOrgans();
            await loadOrgansStats();
            await loadFamiliesList();
            await reloadOrgansAndServices();
        }); 
    };
    
    async function loadCrudOrgans(){
        let organs = await fetch(`${SUPABASE_URL}/rest/v1/organs?select=*,services(*)`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }).then(r=>r.json());
        let html = `<button onclick="window.showFullOrganRegistration()" class="btn-primary">+ Adicionar Novo Órgão</button>`;
        for(let o of organs){
            html += `<div class="organ-card"><h4>${o.name}</h4>
                <div style="margin-bottom:12px;"><button onclick="editOrganFromAdmin(${o.id})" class="btn-primary" style="background:#7A4895;">Editar Órgão</button> <button onclick="deleteOrganPrompt(${o.id}, '${o.name.replace(/'/g, "\\'")}')" class="btn-danger">Excluir Órgão</button></div>
                <div><strong>Serviços:</strong><br>`;
            if(o.services && o.services.length){
                for(let s of o.services){
                    html += `<span class="service-tag">${s.name} <button onclick="editServicePrompt(${s.id})" class="btn-primary" style="padding:2px 8px;margin-left:5px;background:#7A4895;">✏️</button> <button onclick="deleteServicePrompt(${s.id})" class="btn-danger" style="padding:2px 8px;">✖️</button></span>`;
                }
            } else { html += '<span style="color:#a78bfa;">Nenhum serviço cadastrado</span>'; }
            html += `<div style="margin-top:12px;"><button onclick="addServiceToOrganPrompt(${o.id})" class="btn-primary" style="background:#f3e8ff;color:#7A4895;">+ Adicionar Serviço</button></div></div></div>`;
        }
        adminCache.crudOrgans = html;
        document.getElementById('adminTabContent').innerHTML = html;
    }
    
    loadAllMothers();
    loadOrgansAndServices();
</script>
</body>
</html>
