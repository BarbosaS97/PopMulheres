    async function loadDadosEnraizados() {
        try {
            const hdrs = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };
            const [allMothersRaw, allMenRaw, attendances, motherProfiles, questionnaires, allChildren, childProfiles, menProfiles] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/mothers?select=id,name,observation&order=name`, { headers: hdrs }).then(r => r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/men?select=id,name&order=name`, { headers: hdrs }).then(r => r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/attendances?select=mother_id`, { headers: hdrs }).then(r => r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/member_profile?select=member_id&member_type=eq.mother`, { headers: hdrs }).then(r => r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/questionnaires?select=mother_id`, { headers: hdrs }).then(r => r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/children?select=id,mother_id`, { headers: hdrs }).then(r => r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/member_profile?select=member_id&member_type=eq.child`, { headers: hdrs }).then(r => r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/member_profile?select=member_id&member_type=eq.man`, { headers: hdrs }).then(r => r.json())
            ]);

            const mothers     = allMothersRaw.filter(m => !m.observation?.startsWith('__man_shadow__:'));
            const shadowMothers = allMothersRaw.filter(m => m.observation?.startsWith('__man_shadow__:'));

            // Mapa manId → shadowMotherId
            const manShadowMap = {};
            for(const s of shadowMothers) {
                const manId = parseInt(s.observation.replace('__man_shadow__:', ''));
                if(!isNaN(manId)) manShadowMap[manId] = s.id;
            }

            const withAttendances   = new Set(attendances.map(a => a.mother_id));
            const withMotherProfile = new Set(motherProfiles.map(p => p.member_id));
            const withQuestionnaire = new Set(questionnaires.map(q => q.mother_id));
            const withChildProfile  = new Set(childProfiles.map(p => p.member_id));
            const withManProfile    = new Set(menProfiles.map(p => p.member_id));

            const childrenByMother = {};
            for(const c of allChildren) {
                if(!childrenByMother[c.mother_id]) childrenByMother[c.mother_id] = [];
                childrenByMother[c.mother_id].push(c.id);
            }

            function hasMotherData(id) {
                if(withAttendances.has(id) || withMotherProfile.has(id) || withQuestionnaire.has(id)) return true;
                return (childrenByMother[id] || []).some(cid => withChildProfile.has(cid));
            }

            function hasManData(manId) {
                if(withManProfile.has(manId)) return true;
                const shadowId = manShadowMap[manId];
                return shadowId ? withAttendances.has(shadowId) : false;
            }

            // Juntar mães e homens em lista única ordenada por nome
            const allEntries = [
                ...mothers.map(m => ({ type: 'mother', id: m.id, name: m.name })),
                ...allMenRaw.map(m => ({ type: 'man', id: m.id, name: m.name }))
            ].sort((a, b) => a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' }));

            const total    = allEntries.length;
            const comDados = allEntries.filter(e => e.type === 'mother' ? hasMotherData(e.id) : hasManData(e.id)).length;

            let rows = '';
            for(const entry of allEntries) {
                const active   = entry.type === 'mother' ? hasMotherData(entry.id) : hasManData(entry.id);
                const nameSafe = entry.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const badge    = entry.type === 'man'
                    ? `<span style="font-size:0.72rem;background:#e9d5ff;color:#7A4895;padding:2px 8px;border-radius:10px;margin-left:6px;">Homem</span>`
                    : '';
                const shadowId = entry.type === 'man' ? (manShadowMap[entry.id] ?? null) : null;
                const onclick  = entry.type === 'mother'
                    ? `window.resetarFamilia(${entry.id},'${nameSafe}')`
                    : `window.resetarHomem(${entry.id},${shadowId},'${nameSafe}')`;
                rows += `
                    <div class="enraizados-row" data-name="${entry.name.toLowerCase()}">
                        <span class="enraizados-name">${entry.name}${badge}</span>
                        <button class="btn-resetar ${active ? 'btn-resetar-active' : 'btn-resetar-inactive'}"
                            ${active ? `onclick="${onclick}"` : 'disabled'}>
                            ${active ? '🟢 Resetar' : '⚪ Sem dados'}
                        </button>
                    </div>`;
            }

            const html = `
                <div style="color:#7A4895;font-size:0.85rem;margin-bottom:16px;">
                    <strong>${total}</strong> pessoa(s) cadastrada(s) —
                    <strong style="color:#16a34a;">${comDados}</strong> com atendimento ou cadastro complementar
                </div>
                <input type="text" class="enraizados-search" id="enraizadosSearch" placeholder="Filtrar por nome...">
                <div id="enraizadosList">${rows || '<div class="loading-placeholder">Nenhum cadastro encontrado.</div>'}</div>`;

            document.getElementById('adminTabContent').innerHTML = html;

            document.getElementById('enraizadosSearch').addEventListener('input', e => {
                const q = e.target.value.toLowerCase().trim();
                document.querySelectorAll('.enraizados-row').forEach(row => {
                    row.style.display = row.dataset.name.includes(q) ? '' : 'none';
                });
            });
        } catch(e) {
            document.getElementById('adminTabContent').innerHTML = '<div class="loading-placeholder">Erro ao carregar dados. Tente novamente.</div>';
        }
    }

    window.resetarFamilia = async function(motherId, motherName) {
        showConfirmModal(
            `Resetar atendimento e cadastro complementar de <strong>${motherName}</strong>?<br>Nomes e filhos permanecem. Esta ação não pode ser desfeita.`,
            async () => {
                const hdrs = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };

                // Buscar atendimentos e filhos em paralelo
                const [attData, childData] = await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/attendances?select=id&mother_id=eq.${motherId}`, { headers: hdrs }).then(r => r.ok ? r.json() : []),
                    fetch(`${SUPABASE_URL}/rest/v1/children?select=id&mother_id=eq.${motherId}`, { headers: hdrs }).then(r => r.ok ? r.json() : [])
                ]);
                const attendanceIds = attData.map(a => a.id);
                const childIds = childData.map(c => c.id);

                // Deletar itens de atendimento e limpar cache de serviços
                for(const attId of attendanceIds) {
                    await fetch(`${SUPABASE_URL}/rest/v1/attendance_items?attendance_id=eq.${attId}`, { method:'DELETE', headers: hdrs });
                    for(const key of Object.keys(servicesCache)) {
                        if(key.startsWith(`${attId}_`)) delete servicesCache[key];
                    }
                }

                // Deletar tudo em paralelo
                const ops = [
                    fetch(`${SUPABASE_URL}/rest/v1/attendances?mother_id=eq.${motherId}`,                          { method:'DELETE', headers: hdrs }),
                    fetch(`${SUPABASE_URL}/rest/v1/member_profile?member_type=eq.mother&member_id=eq.${motherId}`, { method:'DELETE', headers: hdrs }),
                    fetch(`${SUPABASE_URL}/rest/v1/questionnaires?mother_id=eq.${motherId}`,                       { method:'DELETE', headers: hdrs }),
                    // Limpar campos preenchidos pelo triador na mãe (sem apagar nome, CPF de cadastro ou birth_date)
                    fetch(`${SUPABASE_URL}/rest/v1/mothers?id=eq.${motherId}`, {
                        method: 'PATCH',
                        headers: { ...hdrs, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ telefone: null, data_nascimento: null })
                    }),
                    // Deletar perfis de todos os filhos
                    ...childIds.map(cid =>
                        fetch(`${SUPABASE_URL}/rest/v1/member_profile?member_type=eq.child&member_id=eq.${cid}`, { method:'DELETE', headers: hdrs })
                    )
                ];
                await Promise.all(ops);

                // Limpar caches em memória
                delete profileCache[`mother_${motherId}`];
                delete questionnaireCache[motherId];
                for(const cid of childIds) delete profileCache[`child_${cid}`];

                // Resetar estado ativo se for a mãe em tela
                if(currentMother && currentMother.id === motherId) {
                    currentAttendance = null; currentFamilyMember = null;
                    currentMemberType = null; currentMemberServices = [];
                    currentQuestionnaire = { id: null, homeless: false, domestic_violence: false, protective_measure: false, children_school: false, serious_illness: false, obs: '' };
                    document.getElementById('attendanceContent').innerHTML = '<div style="text-align:center;color:#a78bfa;padding:60px;">Selecione um familiar à esquerda</div>';
                    document.getElementById('btnFinalizar').style.display = 'none';
                    document.getElementById('btnEditFamily').style.display = 'none';
                    document.querySelector('.attendance-area').classList.remove('finished');
                    await loadFamilyTree(motherId);
                }

                adminCache.families = null; adminCache.organs = null;
                adminCache.crudFamilies = null; adminCache.enraizados = null;

                showAlertModal(`Dados de <strong>${motherName}</strong> resetados com sucesso!`, true);
                await loadDadosEnraizados();
            }
        );
    };

    window.resetarHomem = async function(manId, shadowId, manName) {
        showConfirmModal(
            `Resetar atendimento e cadastro complementar de <strong>${manName}</strong>?<br>O nome permanece. Esta ação não pode ser desfeita.`,
            async () => {
                const hdrs = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };

                if(shadowId) {
                    const attData = await fetch(`${SUPABASE_URL}/rest/v1/attendances?select=id&mother_id=eq.${shadowId}`, { headers: hdrs }).then(r => r.ok ? r.json() : []);
                    for(const att of attData) {
                        await fetch(`${SUPABASE_URL}/rest/v1/attendance_items?attendance_id=eq.${att.id}`, { method: 'DELETE', headers: hdrs });
                        for(const key of Object.keys(servicesCache)) {
                            if(key.startsWith(`${att.id}_`)) delete servicesCache[key];
                        }
                    }
                }

                const ops = [
                    fetch(`${SUPABASE_URL}/rest/v1/member_profile?member_type=eq.man&member_id=eq.${manId}`, { method: 'DELETE', headers: hdrs })
                ];
                if(shadowId) {

                            body: JSON.stringify({ cpf: null, telefone: null, data_nascimento: null })

                    );

                await Promise.all(ops);

                delete profileCache[`man_${manId}`];

                if(currentMother?._isMan && currentMother._manId === manId) {
                    currentAttendance = null; currentFamilyMember = null;
                    currentMemberType = null; currentMemberServices = [];
                    document.getElementById('attendanceContent').innerHTML = '<div style="text-align:center;color:#a78bfa;padding:60px;">Selecione um familiar à esquerda</div>';
                    document.getElementById('btnFinalizar').style.display = 'none';

                    document.querySelector('.attendance-area').classList.remove('finished');
                    if(shadowId) await loadFamilyTree(shadowId);
                }

                adminCache.families = null; adminCache.organs = null;
                adminCache.crudFamilies = null; adminCache.enraizados = null;

                showAlertModal(`Dados de <strong>${manName}</strong> resetados com sucesso!`, true);
                await loadDadosEnraizados();
            }
        );
    };

                <div class="modal-buttons">
                    <button id="saveEditHomemBtn" class="btn-primary">Salvar Alterações</button>
                    <button id="cancelEditHomemBtn" class="btn-secondary">Cancelar</button>
                </div>
            </div>`;
        document.body.appendChild(modal);
        const input = document.getElementById('editHomemName');
        input.focus(); input.select();

        modal.querySelector('#saveEditHomemBtn').onclick = async () => {
            const newName = input.value.trim();
            if(!newName) { showAlertModal('Nome é obrigatório.', false); return; }
            const hdrs = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' };
            const res = await fetch(`${SUPABASE_URL}/rest/v1/men?id=eq.${id}`, { method: 'PATCH', headers: hdrs, body: JSON.stringify({ name: newName }) });
            if(res.ok) {
                showAlertModal('Nome atualizado com sucesso!', true);
                modal.remove();
                adminCache.homens = null;
                await loadAllMen();
                await loadHomens();
            } else {
                showAlertModal('Erro ao atualizar.', false);
            }
        };
        modal.querySelector('#cancelEditHomemBtn').onclick = () => modal.remove();
    };

    window.deleteHomem = function(id, name) {
        showConfirmModal(`Excluir <strong>${name}</strong> do cadastro? Esta ação não pode ser desfeita.`, async () => {
            const hdrs = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };
            const res = await fetch(`${SUPABASE_URL}/rest/v1/men?id=eq.${id}`, { method: 'DELETE', headers: hdrs });
            if(res.ok) {
                showAlertModal('Homem excluído com sucesso!', true);
            } else {
                showAlertModal('Erro ao excluir.', false);
            }
            adminCache.homens = null;
            await loadAllMen();
            await loadHomens();
        });
    };

    function _startApp() {
        loadAllMothers();
        loadAllMen();
        loadOrgansAndServices();
    }

    (async function() {
        const ls = document.getElementById('lock-screen');
        if(sessionStorage.getItem('_k1') === '1') {
            ls.style.display = 'none';
            _startApp();
            return;
        }
        const btn = document.getElementById('lockSubmit');
        const inp = document.getElementById('lockPassword');
        const err = document.getElementById('lockErr');
        async function _tryUnlock() {
            if(!inp.value) return;
            const h = await _vh(inp.value);
            if(h === '182c6bb36893fd95290fa987620f9ec333f24d1bb0ce564dd23c604ff2d14ccf') {
                sessionStorage.setItem('_k1', '1');
                ls.style.display = 'none';
                _startApp();
            } else {
                err.style.display = 'block';
                inp.value = '';
                inp.focus();
            }
        }
        btn.addEventListener('click', _tryUnlock);
        inp.addEventListener('keydown', e => { if(e.key === 'Enter') _tryUnlock(); });
        inp.focus();
    })();
</script>
</body>
</html>
