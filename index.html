        .btn-primary { background: #7A4895; color: white; border: none; padding: 10px 24px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background: #551E75; }

        .btn-danger:hover { background: #b91c1c; }

        .btn-remove-child { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; flex-shrink: 0; }
        .btn-add-child { background: #f3e8ff; color: #7A4895; border: none; padding: 8px 16px; border-radius: 30px; font-weight: 600; cursor: pointer; margin-top: 8px; }

        .stats-grid { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px; }

        .member-block { background: #faf5ff; border-radius: 14px; padding: 12px 16px; margin: 8px 0; border-left: 3px solid #AA8DCB; }

        .admin-tab-btn { background: transparent; border: none; padding: 10px 24px; cursor: pointer; font-weight: 600; color: #7A4895; border-radius: 30px; transition: all 0.2s ease; font-size: 0.9rem; }

        .loading-container { text-align: center; padding: 40px; }

        /* Profile form - inline panel */
        .profile-form-wrap { padding: 48px 44px; max-width: 860px; width: 100%; margin: 0 auto; }
        .profile-form-wrap .attendance-header { text-align: center; margin-bottom: 36px; }
        .profile-form-wrap .attendance-header h2 { margin-bottom: 6px; font-size: 1.6rem; }
        .profile-form-wrap .attendance-header p { font-size: 1rem; color: #7A4895; }
        .profile-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 32px;
        }
        .profile-section-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0 8px;
            color: #7A4895;
            font-weight: 700;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .profile-section-divider::before,
        .profile-section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e9d5ff;

    function showAlertModal(msg, isSuccess = true) {
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container" style="max-width:450px;"><h3 style="color:${isSuccess ? '#7A4895' : '#dc2626'};">${isSuccess ? 'Sucesso' : 'Aviso'}</h3><p style="color:#4a5568;margin:16px 0;">${msg}</p><div class="modal-buttons"><button class="btn-primary" id="closeModalBtn">Fechar</button></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector('#closeModalBtn').onclick = () => modal.remove();
        setTimeout(() => { if(modal && modal.parentNode) modal.remove(); }, 3000);
    }

    function showConfirmModal(msg, onConfirm) {
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container" style="max-width:450px;"><h3 style="color:#551E75;">Confirmação</h3><p style="margin:16px 0;">${msg}</p><div class="modal-buttons"><button id="confirmYes" class="btn-primary">Confirmar</button><button id="confirmNo" class="btn-secondary">Cancelar</button></div></div>`;

    }

    async function _vh(s) {
        const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
        return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
    }

    function showPasswordModal(callback) {
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container" style="max-width:450px;"><h3 style="color:#551E75;">Acesso Restrito</h3><input type="password" id="adminPassInput" placeholder="Senha do administrador" style="width:100%; padding:12px; border:2px solid #e9d5ff; border-radius:24px; margin:16px 0;"><div class="modal-buttons"><button id="confirmPassBtn" class="btn-primary">Confirmar</button><button id="cancelPassBtn" class="btn-secondary">Cancelar</button></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector('#confirmPassBtn').onclick = async () => {
            const h = await _vh(modal.querySelector('#adminPassInput').value);
            if(h === '9272e1cf36d0451cebe5d556f60d4c8b583a27ff545de4059e869526b9ecd65c'){
                modal.remove();
                if(callback) callback();
            } else {
                showAlertModal('Senha incorreta', false);
                modal.remove();
            }
        };
        modal.querySelector('#adminPassInput').addEventListener('keydown', e => { if(e.key==='Enter') modal.querySelector('#confirmPassBtn').click(); });

    }

    function showPromptModal(title, callback, defaultValue = '') {
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container" style="max-width:450px;"><h3 style="color:#551E75;">${title}</h3><input type="text" id="promptInput" placeholder="Digite o valor" value="${defaultValue.replace(/"/g, '&quot;')}" style="width:100%; padding:12px; border:2px solid #e9d5ff; border-radius:24px; margin:16px 0;"><div class="modal-buttons"><button id="promptConfirm" class="btn-primary">Confirmar</button><button id="promptCancel" class="btn-secondary">Cancelar</button></div></div>`;
        document.body.appendChild(modal);
        modal.querySelector('#promptConfirm').onclick = () => { let val = modal.querySelector('#promptInput').value; if(val) callback(val); modal.remove(); };
        modal.querySelector('#promptCancel').onclick = () => modal.remove();
    }

    async function loadAllMothers() {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/mothers?select=*&order=name`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
        if(res.ok) allMothers = (await res.json()).filter(m => !m.observation?.startsWith('__man_shadow__:'));
        return allMothers;
    }

    async function findOrCreateManShadow(man) {
        const hdrs = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };
        const res = await fetch(`${SUPABASE_URL}/rest/v1/mothers?select=*&observation=eq.__man_shadow__:${man.id}&limit=1`, { headers: hdrs });
        if(res.ok) {
            const data = await res.json();
            if(data.length > 0) return data[0];
        }
        const ins = await fetch(`${SUPABASE_URL}/rest/v1/mothers`, {
            method: 'POST',
            headers: { ...hdrs, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
            body: JSON.stringify({ name: man.name, observation: `__man_shadow__:${man.id}` })
        });
        if(!ins.ok) throw new Error(await ins.text());
        return (await ins.json())[0];
    }

    async function selectMan(man) {
        try {
            const shadow = await findOrCreateManShadow(man);
            await selectMother({ ...shadow, _isMan: true, _manId: man.id, name: man.name });
        } catch(e) {
            showAlertModal('Erro ao carregar atendimento do homem. Tente novamente.', false);
        }
    }

    async function loadAllMen() {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/men?select=*&order=name`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
        if(res.ok) allMen = await res.json();
        return allMen;
    }
    
    async function loadOrgansAndServices() {
        if(allOrgans.length > 0) return;
        const organsRes = await fetch(`${SUPABASE_URL}/rest/v1/organs?select=*&order=name`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
        if(organsRes.ok) allOrgans = await organsRes.json();
        await Promise.all(allOrgans.map(async organ => {
            const servicesRes = await fetch(`${SUPABASE_URL}/rest/v1/services?select=*&organ_id=eq.${organ.id}&order=name`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
            if(servicesRes.ok) allServices[organ.id] = await servicesRes.json();
        }));
    }

    async function reloadOrgansAndServices() {
        allOrgans = [];
        allServices = {};
        await loadOrgansAndServices();
    }
    
    document.getElementById('searchMother').addEventListener('input', (e) => searchMothers(e.target.value));
    
    async function searchMothers(q) {
        if(!q.trim()) { document.getElementById('searchResults').classList.remove('active'); return; }
        const ql = q.toLowerCase();
        const filteredMothers = allMothers.filter(m => m.name.toLowerCase().includes(ql));
        const filteredMen = allMen.filter(m => m.name.toLowerCase().includes(ql));
        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = '';
        if(filteredMothers.length || filteredMen.length) {
            resultsDiv.classList.add('active');
            filteredMothers.forEach(m => {
                let div = document.createElement('div'); div.className = 'search-item'; div.textContent = m.name;
                div.onclick = () => selectMother(m); resultsDiv.appendChild(div);
            });
            filteredMen.forEach(m => {
                let div = document.createElement('div'); div.className = 'search-item';
                div.innerHTML = `${m.name} <span style="font-size:0.72rem;background:#e9d5ff;color:#7A4895;padding:2px 8px;border-radius:10px;margin-left:6px;">Homem</span>`;
                div.onclick = () => selectMan(m);
                resultsDiv.appendChild(div);
            });
        } else resultsDiv.classList.remove('active');
    }
    
    function makeChildRowElement(removable = true) {
        const racaOpts = ['Preta','Parda','Branca','Amarela','Indígena','Prefere não informar'];
        const div = document.createElement('div');
        div.className = 'child-row';

                        <option>Masculino</option>

                <div class="form-group">

                        <option value="">Selecionar...</option>
                        ${racaOpts.map(o => `<option>${o}</option>`).join('')}
                    </select>
                </div>
            </div>`;
        div.querySelector('.child-skip').addEventListener('change', function() {
            div.querySelector('.child-extra-fields').style.display = this.checked ? 'none' : 'grid';
        });
        div.querySelector('.child-cpf').addEventListener('input', function() {
            let v = this.value.replace(/\D/g,'').slice(0,11);
            if(v.length<=3){this.value=v;return;}
            if(v.length<=6){this.value=v.slice(0,3)+'.'+v.slice(3);return;}
            if(v.length<=9){this.value=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);return;}
            this.value=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9);
        });
        return div;
    }

    window.showFullMotherRegistration = function(editMode = false, motherData = null) {
        let modal = document.createElement('div'); modal.className = 'modal-overlay';
        let title = editMode ? 'Editar Mãe' : 'Cadastrar Nova Mãe';
        let saveBtnText = editMode ? 'Salvar Alterações' : 'Salvar e Atender';
        let motherName = editMode && motherData ? motherData.name || '' : '';
        let motherBirth = editMode && motherData && motherData.birth_date ? motherData.birth_date : '';
        let motherCpf = editMode && motherData && motherData.cpf ? motherData.cpf : '';
        let motherObs = editMode && motherData && motherData.observation ? motherData.observation : '';
        let childrenHtml = '';
        if(!editMode) {
            childrenHtml = `<div class="form-group"><label>Filhos</label><div id="childrenList"></div><button type="button" class="btn-add-child" id="addChildField">+ Adicionar filho</button></div>`;

            <div class="form-group"><label>Observação</label><input type="text" id="newMotherObs" placeholder="Ex: gestante, necessidades especiais" value="${motherObs.replace(/"/g, '&quot;')}"></div>
            ${childrenHtml}
            <div class="modal-buttons"><button id="saveNewMotherBtn" class="btn-primary">${saveBtnText}</button><button id="cancelNewMotherBtn" class="btn-secondary">Cancelar</button></div>
        </div>`;
        document.body.appendChild(modal);
        
        if(!editMode) {
            document.getElementById('childrenList').appendChild(makeChildRowElement(false));
            document.getElementById('addChildField').onclick = () => {
                document.getElementById('childrenList').appendChild(makeChildRowElement(true));
            };
        }
        
        modal.querySelector('#saveNewMotherBtn').onclick = async () => {
            let name = document.getElementById('newMotherName').value;
            if(!name) { showAlertModal('Nome da mãe é obrigatório', false); return; }
            let birth = document.getElementById('newMotherBirth').value;
            let cpf = document.getElementById('newMotherCpf').value;
            let obs = document.getElementById('newMotherObs').value;
            let cpfToSend = cpf && cpf.trim() !== '' ? cpf : null;
            
            try {
                if(editMode && motherData) {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/mothers?id=eq.${motherData.id}`, { 
                        method:'PATCH', 
                        headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, 
                        body: JSON.stringify({ name, birth_date: birth || null, cpf: cpfToSend, observation: obs || null }) 
                    });
                    if(response.ok) {
                        showAlertModal('Mãe editada com sucesso!', true);
                        modal.remove();
                        await loadAllMothers();
                        if(currentMother && currentMother.id === motherData.id) {
                            await selectMother({ ...currentMother, name });
                        }
                        adminCache.crudFamilies = null;
                        adminCache.organs = null;
                        adminCache.families = null;
                        if(adminModal && document.body.contains(adminModal) && currentAdminTab === 'crudFamilies') await loadCrudFamilies();
                    } else {
                        const error = await response.text();
                        showAlertModal('Erro ao editar: ' + error, false);
                    }
                } else {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/mothers`, {
                        method:'POST',
                        headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=representation' },
                        body: JSON.stringify({ name, birth_date: birth || null, cpf: cpfToSend, observation: obs || null })
                    });

                    if(response.ok){
                        const newMother = await response.json();
                        const motherId = newMother[0]?.id;
                        if(motherId) {
                            const childRows = document.querySelectorAll('#childrenList .child-row');
                            for(const row of childRows) {
                                const childName = row.querySelector('.child-name')?.value?.trim();
                                if(!childName) continue;
                                const ageVal = row.querySelector('.child-age')?.value?.trim();
                                const skip = row.querySelector('.child-skip')?.checked;
                                const childData = { mother_id: motherId, name: childName, age: ageVal || null };
                                if(!skip) {
                                    const cpf = row.querySelector('.child-cpf')?.value?.trim() || null;
                                    const dataNasc = row.querySelector('.child-data-nasc')?.value || null;
                                    const genero = row.querySelector('.child-genero')?.value || null;
                                    const raca = row.querySelector('.child-raca')?.value || null;
                                    if(cpf)      childData.cpf             = cpf;
                                    if(dataNasc) childData.data_nascimento = dataNasc;
                                    if(genero)   childData.genero          = genero;
                                    if(raca)     childData.raca            = raca;
                                }
                                await fetch(`${SUPABASE_URL}/rest/v1/children`, {
                                    method:'POST',
                                    headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' },
                                    body: JSON.stringify(childData)
                                });
                            }
                            showAlertModal('Mãe e filhos cadastrados com sucesso!', true);
                            modal.remove();
                            await loadAllMothers();
                            const motherDataComplete = allMothers.find(m => m.id === motherId);
                            if(motherDataComplete) await selectMother(motherDataComplete);
                            else location.reload();
                            adminCache.crudFamilies = null;
                            adminCache.organs = null;
                            adminCache.families = null;
                            if(adminModal && document.body.contains(adminModal) && currentAdminTab === 'crudFamilies') await loadCrudFamilies();
                        } else {
                            showAlertModal('Erro ao obter ID da mãe cadastrada.', false);
                            modal.remove();
                            await loadAllMothers();
                        }
                    } else {
                        const error = await response.text();
                        if(error.includes('duplicate key')) showAlertModal('CPF já cadastrado.', false);
                        else showAlertModal('Erro ao cadastrar: ' + error, false);
                    }
                }
            } catch(e) { showAlertModal('Erro ao processar. Tente novamente.', false); }
        };
        modal.querySelector('#cancelNewMotherBtn').onclick = () => modal.remove();
    };

    async function loadFamilyTree(motherId){
        const hdrs = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };
        if(currentMother?._isMan) {
            const man = allMen.find(m => m.id === currentMother._manId) || { id: currentMother._manId, name: currentMother.name };
            const escAttr = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
            const childrenResp = await fetch(`${SUPABASE_URL}/rest/v1/children?select=*&mother_id=eq.${motherId}&order=name`, { headers: hdrs });
            const manChildren = childrenResp.ok ? await childrenResp.json() : [];
            for(const c of manChildren) childrenCache[c.id] = c;
            let html = `<div class="mother-node"><div class="member-card" data-type="man" data-id="${man.id}" data-name="${escAttr(man.name)}" data-age=""><div class="member-name">${man.name}</div><div class="member-info">Responsável familiar</div></div>`;
            if(manChildren.length > 0) {
                html += `<div class="children-container">`;
                manChildren.forEach(c => {
                    html += `<div class="child-card" data-type="child" data-id="${c.id}" data-name="${escAttr(c.name)}" data-age="${c.age !== null && c.age !== undefined ? c.age : ''}">
                        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">
                            <div style="min-width:0;"><div class="member-name">${c.name}</div><div class="member-info">Filho(a) • ${c.age || 'idade não informada'}</div></div>
                            <button class="btn-edit-child-inline" onclick="event.stopPropagation(); window.editChildFromAdmin(${c.id})">✏️ Editar</button>

                    </div>`;
                });
                html += `</div>`;
            } else {
                html += `<div class="children-container" style="color:#a78bfa; font-size:0.8rem; padding:8px 0 8px 20px;">Nenhum filho cadastrado</div>`;
            }
            html += `<button class="btn-add-child-tree" onclick="window.addChildInline(${motherId})">➕ Adicionar filho(a)</button>`;

            document.getElementById('familyTree').innerHTML = html;
            document.querySelectorAll('#familyTree .member-card, #familyTree .child-card').forEach(el => {
                el.addEventListener('click', () => {

        const childrenResp = await fetch(`${SUPABASE_URL}/rest/v1/children?select=*&mother_id=eq.${motherId}&order=name`, { headers: hdrs });
        let children = childrenResp.ok ? await childrenResp.json() : [];
        for(const c of children) childrenCache[c.id] = c;
        let motherAge = null;
        if(currentMother.birth_date) {
            const today = new Date(); const birth = new Date(currentMother.birth_date);
            motherAge = today.getFullYear() - birth.getFullYear();
            if(today.getMonth() < birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate())) motherAge--;
        }
        const escAttr = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
        let html = `<div class="mother-node"><div class="member-card" data-type="mother" data-id="${currentMother.id}" data-name="${escAttr(currentMother.name)}" data-age="${motherAge ?? ''}"><div class="member-name">${currentMother.name}</div><div class="member-info">Mãe</div></div>`;
        if(children.length > 0){
            html += `<div class="children-container">`;
            children.forEach(c => {
                html += `<div class="child-card" data-type="child" data-id="${c.id}" data-name="${escAttr(c.name)}" data-age="${c.age !== null && c.age !== undefined ? c.age : ''}">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px;">
                        <div style="min-width:0;">
                            <div class="member-name">${c.name}</div>
                            <div class="member-info">Filho(a) • ${c.age || 'idade não informada'}</div>
                        </div>
                        <button class="btn-edit-child-inline" onclick="event.stopPropagation(); window.editChildFromAdmin(${c.id})">✏️ Editar</button>
                    </div>
                </div>`;
            });
            html += `</div>`;
        } else { html += `<div class="children-container" style="color:#a78bfa; font-size:0.8rem; padding:8px 0 8px 20px;">Nenhum filho cadastrado</div>`; }
        html += `<button class="btn-add-child-tree" onclick="window.addChildInline(${motherId})">➕ Adicionar filho(a)</button>`;
        html += `</div>`;
        document.getElementById('familyTree').innerHTML = html;
        document.querySelectorAll('#familyTree .member-card, #familyTree .child-card').forEach(el => {
            el.addEventListener('click', () => {
                const age = el.dataset.age !== '' ? parseInt(el.dataset.age) : null;
                selectFamilyMember(el.dataset.type, parseInt(el.dataset.id), el.dataset.name, age);
            });
        });
    }
    
    async function loadOrCreateAttendance(motherId){
        try {
            const resp = await fetch(`${SUPABASE_URL}/rest/v1/attendances?select=*&mother_id=eq.${motherId}&order=created_at.desc&limit=1`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
            if(!resp.ok) throw new Error();
            const data = await resp.json();
            if(data && data.length) currentAttendance = data[0];
            else {
                const ins = await fetch(`${SUPABASE_URL}/rest/v1/attendances`, { method:'POST', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=representation' }, body: JSON.stringify({ mother_id: motherId, is_finished: false }) });
                if(ins.ok) { const newAtt = await ins.json(); if(newAtt && newAtt[0]) currentAttendance = newAtt[0]; }
            }
        } catch(e) { currentAttendance = { id: Date.now(), mother_id: motherId, is_finished: false }; }
    }

    async function loadQuestionnaire(motherId) {
        currentQuestionnaire = { id: null, homeless: false, domestic_violence: false, protective_measure: false, children_school: false, serious_illness: false, obs: '' };
        if(questionnaireCache[motherId]) {
            currentQuestionnaire = questionnaireCache[motherId];
            return;
        }
        
        try {
            const resp = await fetch(`${SUPABASE_URL}/rest/v1/questionnaires?select=*&mother_id=eq.${motherId}&limit=1`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
            if(resp.ok && resp.status !== 404) {
                const data = await resp.json();
                if(data && data.length) {
                    currentQuestionnaire = data[0];
                    questionnaireCache[motherId] = data[0];
                } else {
                    currentQuestionnaire = { id: null, homeless: false, domestic_violence: false, protective_measure: false, children_school: false, serious_illness: false, obs: '' };
                    questionnaireCache[motherId] = currentQuestionnaire;
                }
            }
        } catch(e) { console.log('Questionário não encontrado'); }
    }

    async function saveQuestionnaire() {
        if(!currentMother || currentMemberType !== 'mother') return;
        const questionnaireData = {
            mother_id: currentMother.id,
            homeless: currentQuestionnaire.homeless,
            domestic_violence: currentQuestionnaire.domestic_violence,
            protective_measure: currentQuestionnaire.protective_measure,
            children_school: currentQuestionnaire.children_school,
            serious_illness: currentQuestionnaire.serious_illness,
            obs: currentQuestionnaire.obs
        };
        try {
            if(currentQuestionnaire.id) {
                await fetch(`${SUPABASE_URL}/rest/v1/questionnaires?id=eq.${currentQuestionnaire.id}`, { method:'PATCH', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, body: JSON.stringify(questionnaireData) });
            } else {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/questionnaires`, { method:'POST', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=representation' }, body: JSON.stringify(questionnaireData) });
                if(res.ok) { const newData = await res.json(); if(newData && newData[0]) currentQuestionnaire.id = newData[0].id; }
            }
            questionnaireCache[currentMother.id] = currentQuestionnaire;
        } catch(e) { console.log('Erro ao salvar questionário'); }
    }
    
    async function checkMemberProfile(memberType, memberId) {
        const cacheKey = `${memberType}_${memberId}`;
        if(profileCache[cacheKey] !== undefined) return profileCache[cacheKey];
        try {
            const resp = await fetch(
                `${SUPABASE_URL}/rest/v1/member_profile?member_type=eq.${memberType}&member_id=eq.${memberId}&limit=1`,
                { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
            );
            if(resp.ok) {
                const data = await resp.json();
                const profile = data.length ? data[0] : null;
                profileCache[cacheKey] = profile;
                return profile;
            }
        } catch(e) { console.log('Erro ao verificar perfil', e); }
        profileCache[`${memberType}_${memberId}`] = null;
        return null;
    }

                <div class="form-group">

                    <input type="date" id="profileDataNasc" value="${dataNascVal}">
                </div>
            </div>` : '';

        const personalDataHtml = showPersonalData ? `
            <div class="profile-section-divider"><span>Dados de Identificação</span></div>
            <div class="profile-form-grid">
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="profileCpf" placeholder="000.000.000-00" maxlength="14" value="${cpfRaw.replace(/"/g,'&quot;')}">

                    <input type="text" id="profileTelefone" placeholder="(00) 00000-0000" maxlength="15" value="${telRaw.replace(/"/g,'&quot;')}">

                    <label>Data de Nascimento <small style="font-weight:400;color:#a78bfa;">(preenche a idade automaticamente)</small></label>

                        <select id="profileRacaEtnia">

                            ${racaOpts.map(o => `<option ${ep?.raca_etnia === o ? 'selected' : ''}>${o}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Gênero *</label>
                        <select id="profileGenero">
                            <option value="">Selecionar...</option>

                        <label>Idade *</label>
                        <input type="number" id="profileIdade" min="0" max="120" placeholder="0 – 120" value="${idadeVal}">
                    </div>

                <div class="profile-form-actions">
                    <button id="saveProfileInlineBtn" class="btn-primary">${ep ? 'Salvar alterações' : 'Salvar e continuar'}</button>

                document.getElementById('attendanceContent').innerHTML = '<div style="text-align:center;color:#a78bfa;padding:60px;">Selecione um familiar à esquerda para iniciar o atendimento.</div>';

            const dateInput  = document.getElementById('profileDataNasc');
            const idadeInput = document.getElementById('profileIdade');

            if(cpfInput) {
                cpfInput.addEventListener('input', function() {
                    let v = this.value.replace(/\D/g, '').slice(0, 11);
                    if(v.length <= 3) { this.value = v; return; }
                    if(v.length <= 6) { this.value = v.slice(0,3) + '.' + v.slice(3); return; }
                    if(v.length <= 9) { this.value = v.slice(0,3) + '.' + v.slice(3,6) + '.' + v.slice(6); return; }
                    this.value = v.slice(0,3) + '.' + v.slice(3,6) + '.' + v.slice(6,9) + '-' + v.slice(9);
                });
            }

            if(telInput) {
                telInput.addEventListener('input', function() {
                    let v = this.value.replace(/\D/g, '').slice(0, 11);
                    if(v.length === 0) { this.value = ''; return; }
                    if(v.length <= 2) { this.value = '(' + v; return; }
                    if(v.length <= 7) { this.value = '(' + v.slice(0,2) + ') ' + v.slice(2); return; }
                    this.value = '(' + v.slice(0,2) + ') ' + v.slice(2,7) + '-' + v.slice(7);
                });
            }

            if(dateInput && idadeInput) {
                function calcularIdade() {
                    if(!dateInput.value) return;
                    const nasc = new Date(dateInput.value + 'T00:00:00');
                    const hoje = new Date();
                    let idade = hoje.getFullYear() - nasc.getFullYear();
                    const m = hoje.getMonth() - nasc.getMonth();
                    if(m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
                    if(idade >= 0 && idade <= 120) idadeInput.value = idade;
                }
                dateInput.addEventListener('change', calcularIdade);
                if(dataNascVal) calcularIdade();
            }
        }
    }

    async function saveProfileAndProceed(memberType, memberId, memberName, defaultAge) {
        const escolaridade = document.getElementById('profileEscolaridade').value;
        const racaEtnia    = document.getElementById('profileRacaEtnia').value;
        const genero       = document.getElementById('profileGenero').value;
        const idadeRaw     = document.getElementById('profileIdade').value;
        if(!escolaridade || !racaEtnia || !genero || idadeRaw === '') {
            showAlertModal('Preencha todos os campos obrigatórios.', false); return;
        }
        const idade = parseInt(idadeRaw);
        if(isNaN(idade) || idade < 0 || idade > 120) {
            showAlertModal('Idade inválida (0 a 120).', false); return;
        }
        const obs = document.getElementById('profObs')?.value || '';

        // Salvar dados de identificação do filho (CPF e data de nascimento, opcionais)
        if(memberType === 'child') {
            const cpf             = document.getElementById('profileCpf')?.value.trim() || null;
            const data_nascimento = document.getElementById('profileDataNasc')?.value || null;
            await saveChildPersonalData(memberId, { cpf: cpf || null, data_nascimento: data_nascimento || null });
        }

        // Salvar dados de identificação (para mães e homens — homens usam o registro shadow)
        if(memberType === 'mother' || memberType === 'man') {
            const cpf            = document.getElementById('profileCpf')?.value.trim() || null;
            const telefone       = document.getElementById('profileTelefone')?.value.trim() || null;
            const data_nascimento = document.getElementById('profileDataNasc')?.value || null;
            const idToSave = memberType === 'man' ? currentMother.id : memberId;
            await saveMotherPersonalData(idToSave, {
                cpf: cpf || null,
                telefone: telefone || null,
                data_nascimento: data_nascimento || null
            });
        }

        const saved = await saveMemberProfile(memberType, memberId, { escolaridade, raca_etnia: racaEtnia, genero, idade, obs });
        if(!saved) return;
        if(memberType === 'mother') {
            currentQuestionnaire = {
                id: currentQuestionnaire.id || null,
                homeless:           document.getElementById('profHomeless').checked,
                domestic_violence:  document.getElementById('profDomViolence').checked,
                protective_measure: document.getElementById('profProtMeasure').checked,
                children_school:    document.getElementById('profChildSchool').checked,
                serious_illness:    document.getElementById('profSeriousIll').checked,
                obs
            };
            await saveQuestionnaire();
        }
        await window.selectFamilyMember(memberType, memberId, memberName, defaultAge);
    }

    async function saveMemberProfile(memberType, memberId, data) {
        try {
            const cacheKey = `${memberType}_${memberId}`;
            const isEdit = !!profileCache[cacheKey];
            const url = isEdit
                ? `${SUPABASE_URL}/rest/v1/member_profile?member_type=eq.${memberType}&member_id=eq.${memberId}`
                : `${SUPABASE_URL}/rest/v1/member_profile`;
            const hdrs = {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json'
            };
            if(!isEdit) hdrs['Prefer'] = 'return=representation';
            const body = JSON.stringify({
                member_type:  memberType,
                member_id:    memberId,
                escolaridade: data.escolaridade,
                raca_etnia:   data.raca_etnia,
                genero:       data.genero,
                idade:        data.idade,
                obs:          data.obs || null
            });
            const res = await fetch(url, { method: isEdit ? 'PATCH' : 'POST', headers: hdrs, body });
            if(res.ok) {
                const profile = isEdit
                    ? { ...profileCache[cacheKey], ...data, member_type: memberType, member_id: memberId }
                    : ((await res.json())[0] || { member_type: memberType, member_id: memberId, ...data });
                profileCache[cacheKey] = profile;
                return profile;
            } else {
                const err = await res.text();
                showAlertModal('Erro ao salvar perfil: ' + err, false);
                return null;
            }
        } catch(e) {
            showAlertModal('Erro de conexão ao salvar perfil.', false);
            return null;
        }
    }

    async function saveMotherPersonalData(motherId, data) {
        try {
            const body = {};
            if(data.cpf !== undefined)             body.cpf             = data.cpf;
            if(data.telefone !== undefined)        body.telefone        = data.telefone;
            if(data.data_nascimento !== undefined) body.data_nascimento = data.data_nascimento;
            const res = await fetch(`${SUPABASE_URL}/rest/v1/mothers?id=eq.${motherId}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if(res.ok && currentMother && currentMother.id === motherId) {
                if(data.cpf !== undefined)             currentMother.cpf             = data.cpf;
                if(data.telefone !== undefined)        currentMother.telefone        = data.telefone;
                if(data.data_nascimento !== undefined) currentMother.data_nascimento = data.data_nascimento;
            }
        } catch(e) { console.log('Erro ao salvar dados pessoais da mãe', e); }
    }

    async function saveChildPersonalData(childId, data) {
        try {
            const body = {};
            if(data.cpf !== undefined)             body.cpf             = data.cpf;
            if(data.data_nascimento !== undefined) body.data_nascimento = data.data_nascimento;
            // Recalcula a idade se a data foi preenchida
            if(data.data_nascimento) {
                const nasc = new Date(data.data_nascimento + 'T00:00:00');
                const hoje = new Date();
                let idade = hoje.getFullYear() - nasc.getFullYear();
                const m = hoje.getMonth() - nasc.getMonth();
                if(m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
                if(idade >= 0 && idade <= 120) body.age = idade;
            }
            await fetch(`${SUPABASE_URL}/rest/v1/children?id=eq.${childId}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if(childrenCache[childId]) {
                if(data.cpf !== undefined)             childrenCache[childId].cpf             = data.cpf;
                if(data.data_nascimento !== undefined) childrenCache[childId].data_nascimento = data.data_nascimento;
                if(body.age !== undefined)             childrenCache[childId].age             = body.age;
            }
        } catch(e) { console.log('Erro ao salvar dados pessoais do filho', e); }
    }

    window.selectFamilyMember = async function(type, id, name, defaultAge = null){
        document.getElementById('attendanceContent').innerHTML = '<div class="loading-container"><div class="spinner"></div><div>Carregando atendimento...</div></div>';

        // Verificar perfil apenas em atendimentos ativos (não read-only)
        const isReadOnlyMode = currentAttendance && currentAttendance.is_finished && !isEditMode;
        if(!isReadOnlyMode) {
            const profile = await checkMemberProfile(type, id);
            if(!profile) {
                renderProfileForm(type, id, name, defaultAge);
                return;
            }
        }

        currentFamilyMember = { id, name };
        currentMemberType = type;

        const cacheKey = `${currentAttendance.id}_${type}_${id}`;
        if(servicesCache[cacheKey]) {
            currentMemberServices = servicesCache[cacheKey];
            renderServiceForm();
            return;
        }

        await loadMemberServices();

        const isFinished = currentAttendance && currentAttendance.is_finished && !isEditMode;
        if(currentMemberServices.length === 0 && !isFinished) {
            currentMemberServices.push({ id: null, organ_id: null, service_id: null });
        }

        servicesCache[cacheKey] = currentMemberServices;
        renderServiceForm();
    };
    
    async function loadMemberServices() {
        if(!currentAttendance || !currentFamilyMember) return;
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/attendance_items?select=*,organs(name),services(name)&attendance_id=eq.${currentAttendance.id}&family_member_type=eq.${currentMemberType}&family_member_id=eq.${currentFamilyMember.id}`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
        if(resp.ok) {
            const items = await resp.json();
            currentMemberServices = items.map(item => ({
                id: item.id,
                organ_id: item.organ_id,
                service_id: item.service_id,
                organ_name: item.organs?.name || item.organ_name,
                service_name: item.services?.name || item.service_name
            }));
        } else {
            currentMemberServices = [];
        }
    }
    
    async function saveServiceRow(organId, serviceId, serviceIdToEdit = null) {
        if(!currentAttendance || !currentFamilyMember) return null;
        const organ = allOrgans.find(o => o.id == organId);
        const services = allServices[organId] || [];
        const service = services.find(s => s.id == serviceId);
        
        const serviceData = {
            attendance_id: currentAttendance.id,
            family_member_type: currentMemberType,
            family_member_id: currentFamilyMember.id,
            organ_id: parseInt(organId),
            service_id: parseInt(serviceId),
            organ_name: organ?.name,
            service_name: service?.name
        };
        
        if(serviceIdToEdit) {
            await fetch(`${SUPABASE_URL}/rest/v1/attendance_items?id=eq.${serviceIdToEdit}`, { method:'PATCH', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json' }, body: JSON.stringify(serviceData) });
            return serviceIdToEdit;
        } else {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/attendance_items`, { method:'POST', headers:{ 'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=representation' }, body: JSON.stringify(serviceData) });
            if(res.ok) {
                const newItem = await res.json();
                return newItem[0]?.id;
            }
        }
        return null;
    }
    
    async function deleteServiceRow(serviceId) {

    function attachRowEvents() {
        document.querySelectorAll('.service-row').forEach(row => {
            const organSelect = row.querySelector('.organ-select');
            const serviceSelect = row.querySelector('.service-select');
            const removeBtn = row.querySelector('.btn-remove-service');
            const serviceId = row.dataset.id;
            
            organSelect.addEventListener('change', async (e) => {
                const newOrganId = e.target.value;
                const currentServiceId = row.dataset.id;
                if(newOrganId) {
                    serviceSelect.disabled = false;
                    serviceSelect.innerHTML = '<option value="">Selecionar serviço</option>' + 
                        allServices[newOrganId].map(s => `<option value="${s.id}">${s.name}</option>`).join('');
                    
                    if(currentServiceId) {
                        await saveServiceRow(newOrganId, serviceSelect.value, currentServiceId);
                        await updateCacheAndRefresh();
                    }
                } else {
                    serviceSelect.disabled = true;
                    serviceSelect.innerHTML = '<option value="">Selecione um órgão primeiro</option>';
                    if(currentServiceId) {
                        await deleteServiceRow(currentServiceId);
                        await updateCacheAndRefresh();
                    }
                }
            });
            
            serviceSelect.addEventListener('change', async (e) => {
                const newOrganId = organSelect.value;
                const newServiceId = e.target.value;
                const currentServiceId = row.dataset.id;
                if(newOrganId && newServiceId) {
                    if(currentServiceId) {
                        await saveServiceRow(newOrganId, newServiceId, currentServiceId);
                    } else {
                        const newId = await saveServiceRow(newOrganId, newServiceId, null);
                        if(newId) row.dataset.id = newId;
                    }
                    await updateCacheAndRefresh();
                    showAlertModal('Serviço salvo!', true);
                }
            });
            
            removeBtn.addEventListener('click', async () => {
                const currentServiceId = row.dataset.id;
                if(currentServiceId) {
                    await deleteServiceRow(currentServiceId);
                    await updateCacheAndRefresh();
                    showAlertModal('Serviço removido!', true);
                } else {
                    const rowIndex = [...document.querySelectorAll('.service-row')].indexOf(row);
                    if(rowIndex >= 0) currentMemberServices.splice(rowIndex, 1);
                    row.remove();
                }
            });
        });
    }
    
    async function updateCacheAndRefresh() {
        await loadMemberServices();
        const cacheKey = `${currentAttendance.id}_${currentMemberType}_${currentFamilyMember.id}`;
        servicesCache[cacheKey] = currentMemberServices;
        renderServiceForm();
    }
    
    async function addNewEmptyRow() {
        // Snapshot current DOM selections to preserve unsaved partial state
        document.querySelectorAll('.service-row').forEach((domRow, i) => {
            if(i < currentMemberServices.length) {
                const organVal = domRow.querySelector('.organ-select')?.value;
                const serviceVal = domRow.querySelector('.service-select')?.value;
                currentMemberServices[i].organ_id = organVal ? parseInt(organVal) : null;
                currentMemberServices[i].service_id = serviceVal ? parseInt(serviceVal) : null;
            }
        });
        currentMemberServices.push({ id: null, organ_id: null, service_id: null });
        const cacheKey = `${currentAttendance.id}_${currentMemberType}_${currentFamilyMember.id}`;
        servicesCache[cacheKey] = currentMemberServices;
        renderServiceForm();
    }
    
    async function generateReportData() {
        if(!currentMother || !currentAttendance) return null;

        const now = new Date();
        const dd  = String(now.getDate()).padStart(2, '0');
        const mm  = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        const dateStr = dd + '/' + mm + '/' + yyyy;

        // Captura snapshots ANTES de qualquer await para evitar race condition com
        // selectMother() que é chamada em paralelo e pode substituir essas variáveis
        const snapMother        = { ...currentMother };
        const snapQuestionnaire = { ...currentQuestionnaire };
        const snapAttendanceId  = currentAttendance.id;

        const hdrs = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };

        const [childResp, itemsResp] = await Promise.all([
            fetch(`${SUPABASE_URL}/rest/v1/children?select=*&mother_id=eq.${snapMother.id}&order=name`, { headers: hdrs }),
            fetch(`${SUPABASE_URL}/rest/v1/attendance_items?attendance_id=eq.${snapAttendanceId}&select=*,organs(name),services(name)`, { headers: hdrs })
        ]);
        const children = childResp.ok ? await childResp.json() : [];
        const allItems = itemsResp.ok ? await itemsResp.json() : [];

        function itemsFor(memberType, memberId) {
            return allItems
                .filter(i => i.family_member_type === memberType && Number(i.family_member_id) === Number(memberId))
                .filter(i => i.organ_name || i.organs?.name)
                .map(i => ({
                    organ_name:   i.organs?.name   || i.organ_name   || '',
                    service_name: i.services?.name || i.service_name || ''
                }));
        }

        async function getProfile(memberType, memberId) {
            const key = `${memberType}_${memberId}`;
            const raw = profileCache[key] || await (async () => {
                const r = await fetch(
                    `${SUPABASE_URL}/rest/v1/member_profile?member_type=eq.${memberType}&member_id=eq.${memberId}&limit=1`,
                    { headers: hdrs }
                );
                const d = r.ok ? await r.json() : [];
                return d[0] || null;
            })();
            if(!raw) return undefined;
            const mapped = {
                escolaridade: raw.escolaridade || '',
                raca_etnia:   raw.raca_etnia   || '',
                genero:       raw.genero        || '',
                idade:        Number(raw.idade) || 0
            };
            if(raw.obs) mapped.obs = raw.obs;
            return mapped;
        }

        const [motherProfile, motherServices] = await Promise.all([
            getProfile('mother', snapMother.id),
            Promise.resolve(itemsFor('mother', snapMother.id))
        ]);

        const childrenData = await Promise.all(children.map(async c => {
            const child = {
                id:       c.id,
                name:     c.name,
                services: itemsFor('child', c.id),
                profile:  await getProfile('child', c.id)
            };
            const age = parseInt(c.age);
            if(!isNaN(age))       child.age             = age;
            if(c.cpf)             child.cpf             = c.cpf;
            if(c.data_nascimento) child.data_nascimento  = c.data_nascimento;
            return child;
        }));

        const q = snapQuestionnaire;
        const questionnaire = {
            homeless:           Boolean(q.homeless),
            domestic_violence:  Boolean(q.domestic_violence),
            protective_measure: Boolean(q.protective_measure),
            children_school:    Boolean(q.children_school),
            serious_illness:    Boolean(q.serious_illness)
        };
        if(q.obs) questionnaire.obs = q.obs;

        const mother = {
            id:       snapMother.id,
            name:     snapMother.name,
            services: motherServices
        };
        // data_nascimento é o campo preenchido pelo triador; birth_date é fallback do cadastro original
        const dob = snapMother.data_nascimento || snapMother.birth_date;
        if(dob)               mother.birth_date  = dob;
        if(snapMother.cpf)    mother.cpf         = snapMother.cpf;
        if(snapMother.telefone) mother.telefone  = snapMother.telefone;
        if(snapMother.observation && !snapMother.observation.startsWith('__man_shadow__:'))
                              mother.observation = snapMother.observation;
        if(motherProfile)     mother.profile     = motherProfile;

        return { mother, questionnaire, children: childrenData, attendanceDate: dateStr };
    }

    function exportToExcel(data, filename, sheetName = 'Dados', colWidths = null) {
        const ws = XLSX.utils.aoa_to_sheet(data);
        if(colWidths) ws['!cols'] = colWidths;
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, sheetName);

    async function loadOrgansStats(){
        try {
            const finishedAttendances = await fetch(
                `${SUPABASE_URL}/rest/v1/attendances?select=id&is_finished=eq.true`,
                { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }
            ).then(r=>r.json());

            if(!finishedAttendances.length) {
                document.getElementById('adminTabContent').innerHTML = '<div class="loading-placeholder">Nenhum atendimento finalizado ainda. Os dados aparecerão aqui após a finalização de um atendimento.</div>';
                return;
            }

            const finishedIds = finishedAttendances.map(a => a.id).join(',');
            const items = await fetch(
                `${SUPABASE_URL}/rest/v1/attendance_items?select=*&attendance_id=in.(${finishedIds})`,
                { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }
            ).then(r=>r.json());

            let organMap = new Map();
            let maxTotal = 0;
            items.forEach(i => {
                if(i.organ_name){
                    if(!organMap.has(i.organ_name)) organMap.set(i.organ_name, { total:0, services: new Map() });
                    let org = organMap.get(i.organ_name);
                    org.total +=1;
                    if(i.service_name) org.services.set(i.service_name, (org.services.get(i.service_name)||0)+1);
                    if(org.total > maxTotal) maxTotal = org.total;
                }
            });
            let sortedOrgans = Array.from(organMap.entries()).sort((a,b)=>b[1].total - a[1].total);

            const grandTotal = items.length;
            let html = `<div style="margin-bottom:20px;"><button id="exportOrgansExcel" class="btn-primary">📎 Exportar Órgãos e Serviços (Excel)</button></div>`;
            if(sortedOrgans.length === 0) {
                html += '<div class="loading-placeholder">Nenhum serviço registrado nos atendimentos finalizados.</div>';
            } else {
                html += `<div class="stats-grid">`;
                for(let [orgName, orgData] of sortedOrgans){
                    let sortedServices = Array.from(orgData.services.entries()).sort((a,b)=>b[1]-a[1]);
                    let maxSvc = sortedServices.length > 0 ? sortedServices[0][1] : 1;
                    let barsHtml = sortedServices.map(([srvName, qty]) => {
                        let pct = Math.max(8, Math.round((qty / maxSvc) * 100));
                        let pctLabel = grandTotal > 0 ? Math.round(qty / grandTotal * 100) + '% do total' : '';
                        return `<div class="svc-bar-row">
                            <div class="svc-bar-label"><span class="svc-bar-label-name" title="${srvName}">${srvName}</span><span class="svc-bar-label-pct">${pctLabel}</span></div>
                            <div class="svc-bar-track"><div class="svc-bar-fill" style="width:${pct}%;"><span class="svc-bar-count">${qty}</span></div></div>
                        </div>`;
                    }).join('');
                    html += `<div class="stat-card">
                        <div class="organ-header"><h3>${orgName}</h3><span class="organ-total-chip">${orgData.total} solicitações</span></div>
                        ${barsHtml}
                    </div>`;
                }
                html += `</div>`;
            }
            document.getElementById('adminTabContent').innerHTML = html;

            document.getElementById('exportOrgansExcel').onclick = () => {
                const today = new Date().toLocaleDateString('pt-BR');
                const NCOLS_ORG = 4;
                let wsData = [
                    ['RELATÓRIO DE ÓRGÃOS E SERVIÇOS SOLICITADOS — PopMulheres'],
                    [`Gerado em: ${today}`],
                    [`Total de registros de serviços: ${grandTotal}   |   Total de órgãos: ${sortedOrgans.length}`],
                    []
                ];
                let merges = [];
                for(let [orgName, orgData] of sortedOrgans) {
                    const orgHeaderRow = wsData.length;
                    wsData.push([`ÓRGÃO: ${orgName}`, '', `Total: ${orgData.total} solicitações`, '']);
                    merges.push({ s: {r: orgHeaderRow, c: 0}, e: {r: orgHeaderRow, c: NCOLS_ORG - 1} });
                    wsData.push(['Serviço', 'Quantidade', '% do Órgão', '% do Total Geral']);
                    let sortedSvcs = Array.from(orgData.services.entries()).sort((a,b) => b[1]-a[1]);
                    for(let [srvName, qty] of sortedSvcs) {
                        const pctOrg   = orgData.total > 0 ? (qty / orgData.total * 100).toFixed(1) + '%' : '';
                        const pctTotal = grandTotal > 0 ? (qty / grandTotal * 100).toFixed(1) + '%' : '';
                        wsData.push([srvName, qty, pctOrg, pctTotal]);
                    }
                    wsData.push([]);
                }
                const ws = XLSX.utils.aoa_to_sheet(wsData);
                ws['!merges'] = merges;
                ws['!cols'] = [{wch:45},{wch:14},{wch:16},{wch:18}];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Orgaos_Servicos');
                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `orgaos_servicos_${today.replace(/\//g,'-')}.xlsx`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
            };
        } catch(e) {
            document.getElementById('adminTabContent').innerHTML = '<div class="loading-placeholder">Erro ao carregar dados</div>';
        }
    }

    window.requestDeleteAttendance = async function(attendanceId) {
        showPasswordModal(async () => {
            showConfirmModal('Remover todo o atendimento desta família? Cadastros complementares e questionário também serão apagados.', async () => {
                const hdrs = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };

                // Buscar mother_id e filhos antes de deletar
                const attResp = await fetch(`${SUPABASE_URL}/rest/v1/attendances?id=eq.${attendanceId}&select=mother_id`, { headers: hdrs });
                const attData = attResp.ok ? await attResp.json() : [];
                const motherId = attData[0]?.mother_id;

                let childrenIds = [];
                if(motherId) {
                    const childResp = await fetch(`${SUPABASE_URL}/rest/v1/children?select=id&mother_id=eq.${motherId}`, { headers: hdrs });
                    const childData = childResp.ok ? await childResp.json() : [];
                    childrenIds = childData.map(c => c.id);
                }

                // Deletar itens e o atendimento
                await fetch(`${SUPABASE_URL}/rest/v1/attendance_items?attendance_id=eq.${attendanceId}`, { method:'DELETE', headers: hdrs });
                await fetch(`${SUPABASE_URL}/rest/v1/attendances?id=eq.${attendanceId}`, { method:'DELETE', headers: hdrs });

                // Deletar cadastros complementares e questionário — reset completo do ciclo
                if(motherId) {
                    await Promise.all([
                        fetch(`${SUPABASE_URL}/rest/v1/member_profile?member_type=eq.mother&member_id=eq.${motherId}`, { method:'DELETE', headers: hdrs }),
                        fetch(`${SUPABASE_URL}/rest/v1/questionnaires?mother_id=eq.${motherId}`, { method:'DELETE', headers: hdrs })
                    ]);
                    delete profileCache[`mother_${motherId}`];
                    delete questionnaireCache[motherId];
                }
                for(const childId of childrenIds) {
                    await fetch(`${SUPABASE_URL}/rest/v1/member_profile?member_type=eq.child&member_id=eq.${childId}`, { method:'DELETE', headers: hdrs });
                    delete profileCache[`child_${childId}`];
                }

                // Limpar cache de serviços do atendimento removido
                for(const key of Object.keys(servicesCache)) {
                    if(key.startsWith(`${attendanceId}_`)) delete servicesCache[key];
                }

                // Resetar estado ativo se for o atendimento em tela
                if(currentAttendance && currentAttendance.id === attendanceId) {
                    currentAttendance = null;
                    currentFamilyMember = null;
                    currentMemberType = null;
                    currentMemberServices = [];
                    currentQuestionnaire = { id: null, homeless: false, domestic_violence: false, protective_measure: false, children_school: false, serious_illness: false, obs: '' };
                    document.getElementById('attendanceContent').innerHTML = '<div style="text-align:center;color:#a78bfa;padding:60px;">Selecione um familiar à esquerda</div>';
                    document.getElementById('btnFinalizar').style.display = 'none';
                    document.getElementById('btnEditFamily').style.display = 'none';
                    document.querySelector('.attendance-area').classList.remove('finished');
                }

                showAlertModal('Atendimento e cadastros complementares removidos com sucesso!', true);
                adminCache.families = null;
                adminCache.organs = null;
                await loadFamiliesList();
            });
        });
    };

    async function loadCrudFamilies(){
        try {
            const [mothers, allChildren] = await Promise.all([
                fetch(`${SUPABASE_URL}/rest/v1/mothers?select=*&order=name`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }).then(r=>r.json()),
                fetch(`${SUPABASE_URL}/rest/v1/children?select=*&order=name`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} }).then(r=>r.json())
            ]);
            const childrenByMother = {};
            for(let child of allChildren) {
                if(!childrenByMother[child.mother_id]) childrenByMother[child.mother_id] = [];
                childrenByMother[child.mother_id].push(child);
            }
            let html = `<button onclick="window.showFullMotherRegistration(false)" class="btn-primary">+ Adicionar Nova Mãe</button><div style="margin-top:20px;">`;
            for(let m of mothers){
                const children = childrenByMother[m.id] || [];
                const childrenItemsHtml = children.length > 0
                    ? children.map(c => {
                        const details = [c.genero, c.raca, c.cpf ? `CPF: ${c.cpf}` : ''].filter(Boolean).join(' · ');
                        return `<div style="display:flex;align-items:center;gap:8px;margin:4px 0 4px 20px;flex-wrap:wrap;">
                            <span style="font-size:0.82rem;color:#551E75;">👤 ${c.name}${c.age != null ? ` (${c.age} anos)` : ''}</span>
                            ${details ? `<span style="font-size:0.78rem;color:#a78bfa;">— ${details}</span>` : ''}
                            <button onclick="editChildFromAdmin(${c.id})" class="btn-primary" style="padding:3px 10px;font-size:0.75rem;min-height:unset;">Editar</button>
                        </div>`;
                    }).join('')
                    : `<div style="margin:6px 0 0 20px;font-size:0.8rem;color:#a78bfa;">Nenhum filho cadastrado</div>`;
                html += `<div style="background:#faf5ff;margin:12px 0;padding:16px;border-radius:20px;">
                    <strong style="color:#7A4895;">${m.name}</strong>
                    <button onclick="editMotherFromAdmin(${m.id})" class="btn-primary" style="background:#7A4895; margin-left:10px;">Editar</button>
                    <button onclick="deleteMotherFromAdmin(${m.id})" class="btn-danger">Excluir</button>
                    <div style="margin-top:10px;font-size:0.82rem;color:#7A4895;font-weight:700;">👶 Filhos:</div>
                    ${childrenItemsHtml}
                </div>`;
            }
            html += `</div>`;
            adminCache.crudFamilies = html;
            document.getElementById('adminTabContent').innerHTML = html;
        } catch(e) {
            document.getElementById('adminTabContent').innerHTML = '<div class="loading-placeholder">Erro ao carregar dados. Tente novamente.</div>';
        }
    }

    window.editChildFromAdmin = async (id) => {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/children?id=eq.${id}`, { headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`} });
        if(!resp.ok) { showAlertModal('Erro ao carregar dados do filho.', false); return; }
        const data = await resp.json();
        const child = data[0];
        if(!child) { showAlertModal('Filho(a) não encontrado.', false); return; }

        const racaOpts = ['Preta','Parda','Branca','Amarela','Indígena','Prefere não informar'];
        const modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container">
            <h3>Editar Filho(a)</h3>
            <div class="form-group"><label>Nome completo *</label><input type="text" id="editChildName" value="${(child.name||'').replace(/"/g,'&quot;')}"></div>
            <div class="form-group"><label>Idade</label><input type="number" id="editChildAge" min="0" max="120" value="${child.age != null ? child.age : ''}"></div>
            <div class="form-group"><label>CPF</label><input type="text" id="editChildCpf" placeholder="000.000.000-00" maxlength="14" value="${(child.cpf||'').replace(/"/g,'&quot;')}"></div>
            <div class="form-group"><label>Data de Nascimento</label><input type="date" id="editChildDataNasc" value="${child.data_nascimento||''}"></div>
            <div class="form-group"><label>Gênero</label>
                <select id="editChildGenero">
                    <option value="">Selecionar...</option>
                    <option ${child.genero==='Masculino'?'selected':''}>Masculino</option>
                    <option ${child.genero==='Feminino'?'selected':''}>Feminino</option>
                </select>
            </div>
            <div class="form-group"><label>Raça/Etnia</label>
                <select id="editChildRaca">
                    <option value="">Selecionar...</option>
                    ${racaOpts.map(o => `<option ${child.raca===o?'selected':''}>${o}</option>`).join('')}
                </select>
            </div>
            <div class="modal-buttons">
                <button id="saveEditChildBtn" class="btn-primary">Salvar Alterações</button>
                <button id="deleteChildBtn" class="btn-danger">🗑️ Excluir Filho(a)</button>
                <button onclick="this.closest('.modal-overlay').remove()" class="btn-secondary">Cancelar</button>
            </div>
        </div>`;
        document.body.appendChild(modal);

        modal.querySelector('#editChildCpf').addEventListener('input', function() {
            let v = this.value.replace(/\D/g,'').slice(0,11);
            if(v.length<=3){this.value=v;return;}
            if(v.length<=6){this.value=v.slice(0,3)+'.'+v.slice(3);return;}
            if(v.length<=9){this.value=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);return;}
            this.value=v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9);
        });

        modal.querySelector('#saveEditChildBtn').onclick = async () => {
            const name = modal.querySelector('#editChildName').value.trim();
            if(!name) { showAlertModal('Nome é obrigatório.', false); return; }
            const age           = modal.querySelector('#editChildAge').value;
            const cpf           = modal.querySelector('#editChildCpf').value.trim() || null;
            const dataNasc      = modal.querySelector('#editChildDataNasc').value || null;
            const genero        = modal.querySelector('#editChildGenero').value || null;
            const raca          = modal.querySelector('#editChildRaca').value || null;
            const res = await fetch(`${SUPABASE_URL}/rest/v1/children?id=eq.${id}`, {
                method: 'PATCH',
                headers: {'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'Content-Type':'application/json'},
                body: JSON.stringify({ name, age: age || null, cpf, data_nascimento: dataNasc, genero, raca })
            });
            if(res.ok) {
                showAlertModal('Dados do(a) filho(a) atualizados com sucesso!', true);
                modal.remove();
                adminCache.crudFamilies = null;
                if(adminModal && document.body.contains(adminModal) && currentAdminTab === 'crudFamilies') await loadCrudFamilies();
                if(currentMother) await loadFamilyTree(currentMother.id);
            } else {
                showAlertModal('Erro ao salvar: ' + (await res.text()), false);
            }
        };

        modal.querySelector('#deleteChildBtn').onclick = () => {
            showConfirmModal(`Excluir o(a) filho(a) "${child.name}"? Os registros de atendimento vinculados também serão removidos.`, async () => {
                const hdrs = { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };
                await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/attendance_items?family_member_type=eq.child&family_member_id=eq.${id}`, { method: 'DELETE', headers: hdrs }),
                    fetch(`${SUPABASE_URL}/rest/v1/member_profile?member_type=eq.child&member_id=eq.${id}`, { method: 'DELETE', headers: hdrs })
                ]);
                const res = await fetch(`${SUPABASE_URL}/rest/v1/children?id=eq.${id}`, { method: 'DELETE', headers: hdrs });
                if(res.ok) {
                    delete profileCache[`child_${id}`];
                    delete childrenCache[id];
                    adminCache.crudFamilies = null;
                    adminCache.families = null;
                    modal.remove();
                    showAlertModal('Filho(a) excluído(a) com sucesso!', true);
                    if(adminModal && document.body.contains(adminModal) && currentAdminTab === 'crudFamilies') await loadCrudFamilies();
                    if(currentMother) await loadFamilyTree(currentMother.id);
                } else {
                    showAlertModal('Erro ao excluir: ' + (await res.text()), false);
                }
            });
        };
    };
